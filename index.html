            const [showDetailsModal, setShowDetailsModal] = useState(false);
            const [showExportModal, setShowExportModal] = useState(false);

            const filteredOrders = useMemo(() => {
                return db.workOrders.filter(wo => {
                    const matchSearch = searchTerm === '' || wo.id.includes(searchTerm) || wo.customerName.includes(searchTerm);
                    const matchDate = dateFilter === '' || wo.date === dateFilter;
                    const matchService = serviceFilter === 'كل الخدمات' || wo.services.join(' ').includes(serviceFilter);
                    const matchStatus = statusFilter === 'الكل' || wo.status === statusFilter;
                    return matchSearch && matchDate && matchService && matchStatus;
                });
            }, [db.workOrders, searchTerm, dateFilter, serviceFilter, statusFilter]);

            const handleDelete = (id) => {
                if(window.confirm('هل أنت متأكد من الحذف؟ سيتم إزالة السجل نهائياً.')){
                    updateDb('workOrders', db.workOrders.filter(w => w.id !== id));
                    addToast('تم الحذف بنجاح', 'success');
                }
            };

            const handleExportConfirm = () => {
                setShowExportModal(false);
                const headers = ["رقم الطلب", "التاريخ", "العميل", "السيارة", "الخدمات المنفذة", "الفني", "المبلغ الكلي", "الحالة", "ملاحظات"];
                const rows = filteredOrders.map(wo => [
                    wo.id, wo.date, wo.customerName, wo.vehicle, wo.services.join(' - '), wo.technician, wo.total, wo.status, (wo.notes||'').replace(/\n/g, ' ')
                ]);
                exportToExcelCSV(`الزيارات_وسجل_الخدمات_${new Date().toISOString().split('T')[0]}.csv`, headers, rows);
                addToast("تم تصدير سجل الزيارات إلى Excel بنجاح", "success");
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">الزيارات وسجل الخدمات</h2>
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4">
                        <input type="text" placeholder="بحث برقم الطلب أو العميل..." className="border rounded-lg px-4 py-2 bg-gray-50 flex-1 min-w-[200px]" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                        <div className="flex flex-wrap gap-2 w-full md:w-auto">
                            <input type="date" className="border rounded-lg px-4 py-2 bg-gray-50 flex-1 md:flex-none" value={dateFilter} onChange={e => setDateFilter(e.target.value)} />
                            <select className="border rounded-lg px-4 py-2 bg-gray-50 flex-1 md:flex-none" value={serviceFilter} onChange={e => setServiceFilter(e.target.value)}>
                                <option>كل الخدمات</option><option>تبديل زيت</option><option>سفايف</option><option>صيانة دورية 40 ألف</option>
                            </select>
                            <select className="border rounded-lg px-4 py-2 bg-gray-50 flex-1 md:flex-none" value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
                                <option>الكل</option><option>مكتمل</option><option>قيد العمل</option>
                            </select>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => { setSearchTerm(''); setDateFilter(''); setServiceFilter('كل الخدمات'); setStatusFilter('الكل'); }} className="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-300 whitespace-nowrap">إعادة ضبط</button>
                            <button onClick={() => setShowExportModal(true)} className="bg-green-600 text-white flex justify-center items-center gap-2 px-4 py-2 rounded-lg font-medium text-sm shadow-md hover:bg-green-700 whitespace-nowrap w-full md:w-auto"><Icons.Download /> تصدير Excel</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-right crm-table">
                                <thead><tr><th>رقم الطلب</th><th>التاريخ</th><th>العميل</th><th>السيارة</th><th>الخدمات المنفذة</th><th>المبلغ</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
                                <tbody>
                                    {filteredOrders.map((wo, i) => (
                                        <tr key={i}>
                                            <td className="font-bold text-brand">{wo.id}</td><td>{wo.date}</td><td className="font-medium">{wo.customerName}</td>
                                            <td dir="ltr" className="text-right">{wo.vehicle}</td><td className="whitespace-normal">{wo.services.join('، ')}</td>
                                            <td className="font-bold">{formatMoney(wo.total)}</td>
                                            <td><span className={`px-2 py-1 rounded text-xs font-bold ${wo.status === 'مكتمل' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{wo.status}</span></td>
                                            <td className="flex gap-2">
                                                <button onClick={() => {setSelectedOrder(wo); setShowDetailsModal(true);}} className="text-brand hover:underline font-bold text-xs bg-blue-50 px-3 py-1.5 rounded border border-blue-200">التفاصيل</button>
                                                <button onClick={() => handleDelete(wo.id)} className="text-red-600 hover:text-red-800 font-bold text-xs bg-red-50 border border-red-200 px-2 py-1.5 rounded"><Icons.Trash /></button>
                                            </td>
                                        </tr>
                                    ))}
                                    {filteredOrders.length === 0 && <tr><td colSpan="8" className="text-center py-10 text-gray-500 font-bold text-lg">لا توجد بيانات حالياً</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <Modal title={`تفاصيل الطلب: ${selectedOrder?.id}`} isOpen={showDetailsModal} onClose={() => setShowDetailsModal(false)}>
                        {selectedOrder && (
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-y-4 gap-x-8 bg-gray-50 p-4 rounded-lg border">
                                    <div><span className="block text-xs text-gray-500">العميل</span><span className="font-bold text-lg">{selectedOrder.customerName}</span></div>
                                    <div><span className="block text-xs text-gray-500">التاريخ</span><span className="font-bold text-lg">{selectedOrder.date}</span></div>
                                    <div><span className="block text-xs text-gray-500">الحالة</span><span className={`px-2 py-1 rounded text-xs font-bold ${selectedOrder.status === 'مكتمل' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{selectedOrder.status}</span></div>
                                    <div><span className="block text-xs text-gray-500">السيارة</span><span className="font-bold">{selectedOrder.vehicle}</span></div>
                                    <div><span className="block text-xs text-gray-500">الفني المسؤول</span><span className="font-bold">{selectedOrder.technician}</span></div>
                                    <div><span className="block text-xs text-gray-500">المبلغ الإجمالي</span><span className="font-bold text-green-600 text-lg">{formatMoney(selectedOrder.total)}</span></div>
                                </div>
                                <div>
                                    <h4 className="font-bold text-gray-700 mb-2 border-b pb-1">الخدمات المنفذة التفصيلية</h4>
                                    <table className="w-full text-right text-sm border-collapse border border-gray-200">
                                        <thead className="bg-gray-100"><tr><th className="border p-2">الخدمة</th><th className="border p-2">التفاصيل</th><th className="border p-2 text-center">الكمية</th><th className="border p-2">السعر</th></tr></thead>
                                        <tbody>
                                            {(selectedOrder.detailedServices||[]).map((s,i)=> <tr key={i}><td className="border p-2 font-bold">{s.name}</td><td className="border p-2 text-xs">{Object.values(s.details||{}).join(' ')}</td><td className="border p-2 text-center">{s.qty||1}</td><td className="border p-2">{formatMoney(s.price)}</td></tr>)}
                                            {(!selectedOrder.detailedServices || selectedOrder.detailedServices.length === 0) && <tr><td colSpan="4" className="border p-2 text-center">{selectedOrder.services.join('، ')}</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                                <div><h4 className="font-bold text-gray-700 mb-2 border-b pb-1">ملاحظات ورقة العمل</h4><p className="text-sm bg-yellow-50 p-3 rounded border border-yellow-200 leading-relaxed whitespace-pre-wrap">{selectedOrder.notes || 'لا توجد ملاحظات.'}</p></div>
                                <div className="flex justify-end pt-4 border-t gap-2">
                                    <button onClick={() => setShowDetailsModal(false)} className="px-4 py-2 bg-gray-200 rounded font-bold">إغلاق</button>
                                    <button onClick={() => { setShowDetailsModal(false); const cust = db.customers.find(c => c.name === selectedOrder.customerName); if(cust) onViewProfile(cust); }} className="bg-brand text-white px-4 py-2 rounded font-bold shadow-md hover:bg-blue-700">فتح ملف العميل الكامل</button>
                                </div>
                            </div>
                        )}
                    </Modal>

                    <Modal title="معاينة تصدير البيانات إلى Excel" isOpen={showExportModal} onClose={() => setShowExportModal(false)} size="max-w-md">
                        <div className="space-y-4">
                            <div className="bg-green-50 p-4 rounded-lg border border-green-200">
                                <h4 className="font-bold text-green-800 mb-2">ملخص البيانات المراد تصديرها</h4>
                                <ul className="text-sm space-y-2 text-green-900">
                                    <li><strong>الملف:</strong> سجل_الزيارات.csv (متوافق مع Excel)</li>
                                    <li><strong>عدد السجلات المتوافقة:</strong> {filteredOrders.length} صف</li>
                                    <li><strong>الفلاتر المطبقة:</strong> {searchTerm || dateFilter || serviceFilter !== 'كل الخدمات' || statusFilter !== 'الكل' ? ' نعم (يتم تصدير البيانات المصفاة فقط)' : ' لا يوجد (تصدير جميع السجلات)'}</li>
                                </ul>
                            </div>
                            <div className="flex justify-end gap-3 pt-4 border-t mt-4">
                                <button onClick={() => setShowExportModal(false)} className="px-4 py-2 bg-gray-200 rounded font-bold">إلغاء</button>
                                <button onClick={handleExportConfirm} className="px-4 py-2 bg-green-600 text-white rounded font-bold shadow-md hover:bg-green-700 flex items-center gap-2"><Icons.Download /> تأكيد وبدء التنزيل</button>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        };

        // 5. FollowUps
        const FollowUps = ({ db, updateDb, onViewProfile, addToast }) => {
            const [filterDate, setFilterDate] = useState('');
            const [filterType, setFilterType] = useState('جميع الأنواع');
            const [filterStatus, setFilterStatus] = useState('الكل');

            const [showFormModal, setShowFormModal] = useState(false);
            const [showDetailsModal, setShowDetailsModal] = useState(false);
            const [isEditing, setIsEditing] = useState(false);
            const [selectedId, setSelectedId] = useState(null);

            const defaultForm = { customer: '', phone: '', type: 'متابعة رضا العميل', reason: '', date: new Date().toISOString().split('T')[0], targetDate: '', emp: 'نور', status: 'جديدة', notes: '' };
            const [formData, setFormData] = useState(defaultForm);

            const filteredData = useMemo(() => {
                return db.followUps.filter(f => {
                    if (filterDate && f.date !== filterDate) return false;
                    if (filterType !== 'جميع الأنواع' && f.type !== filterType) return false;
                    if (filterStatus !== 'الكل' && f.status !== filterStatus) return false;
                    return true;
                });
            }, [db.followUps, filterDate, filterType, filterStatus]);

            const handleStatusChange = (id, newStatus) => {
                updateDb('followUps', db.followUps.map(item => item.id === id ? { ...item, status: newStatus } : item));
                addToast("تم تحديث حالة المتابعة", "success");
            };

            const handleOpenAdd = () => { setFormData(defaultForm); setIsEditing(false); setShowFormModal(true); };
            const handleOpenEdit = (item) => { setFormData(item); setSelectedId(item.id); setIsEditing(true); setShowFormModal(true); };
            const handleOpenDetails = (item) => { setFormData(item); setShowDetailsModal(true); };

            const handleDelete = (id) => {
                if(window.confirm('هل أنت متأكد من الحذف؟')){
                    updateDb('followUps', db.followUps.filter(f => f.id !== id));
                    addToast('تم الحذف بنجاح', 'success');
                }
            };

            const handleSaveForm = () => {
                if(!formData.customer || !formData.phone) return addToast("الرجاء إدخال بيانات العميل", "error");
                if (isEditing) {
                    updateDb('followUps', db.followUps.map(item => item.id === selectedId ? { ...formData, id: selectedId } : item));
                    addToast("تم تعديل المتابعة بنجاح", "success");
                } else {
                    updateDb('followUps', [{ ...formData, id: Date.now() }, ...db.followUps]);
                    addToast("تم إضافة المتابعة بنجاح", "success");
                }
                setShowFormModal(false);
            };

            const isOverdue = (dateStr) => {
                if(!dateStr) return false;
                return new Date(dateStr) < new Date(new Date().toISOString().split('T')[0]);
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">إدارة المتابعات</h2>
                        <button onClick={handleOpenAdd} className="bg-brand text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2 hover:bg-blue-700 shadow-md w-full sm:w-auto"><Icons.Plus /> إضافة متابعة يدوية</button>
                    </div>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-2">
                        <div className="bg-white p-4 rounded-xl border border-l-4 border-l-blue-500 shadow-sm"><p className="text-sm text-gray-500">إجمالي المتابعات</p><p className="text-2xl font-bold">{db.followUps.length}</p></div>
                        <div className="bg-white p-4 rounded-xl border border-l-4 border-l-yellow-500 shadow-sm"><p className="text-sm text-gray-500">قيد المتابعة</p><p className="text-2xl font-bold">{db.followUps.filter(d => d.status === 'قيد المتابعة').length}</p></div>
                        <div className="bg-white p-4 rounded-xl border border-l-4 border-l-red-500 shadow-sm"><p className="text-sm text-gray-500">جديدة / متأخرة</p><p className="text-2xl font-bold text-red-600">{db.followUps.filter(d => d.status === 'جديدة').length}</p></div>
                        <div className="bg-white p-4 rounded-xl border border-l-4 border-l-green-500 shadow-sm"><p className="text-sm text-gray-500">مكتملة</p><p className="text-2xl font-bold">{db.followUps.filter(d => d.status === 'مكتملة').length}</p></div>
                    </div>

                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4">
                        <input type="date" className="border rounded-lg px-4 py-2 bg-gray-50 flex-1 min-w-[150px]" value={filterDate} onChange={e=>setFilterDate(e.target.value)} />
                        <select className="border rounded-lg px-4 py-2 bg-gray-50 flex-1 min-w-[150px]" value={filterType} onChange={e=>setFilterType(e.target.value)}>
                            <option>جميع الأنواع</option><option>تذكير تغيير زيت</option><option>متابعة رضا العميل</option><option>متابعة شكوى</option><option>متابعة عميل غير نشط</option>
                        </select>
                        <select className="border rounded-lg px-4 py-2 bg-gray-50 flex-1 min-w-[150px]" value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
                            <option>الكل</option><option>جديدة</option><option>قيد المتابعة</option><option>مؤجلة</option><option>مكتملة</option>
                        </select>
                        <button onClick={() => {setFilterDate(''); setFilterType('جميع الأنواع'); setFilterStatus('الكل');}} className="bg-gray-200 px-4 py-2 rounded-lg font-medium">إعادة ضبط</button>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-right crm-table">
                                <thead><tr><th>العميل</th><th>نوع المتابعة</th><th>السبب</th><th>تاريخ الاستهداف</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
                                <tbody>
                                    {filteredData.map(f => {
                                        const overdue = f.status !== 'مكتملة' && isOverdue(f.targetDate);
                                        return (
                                        <tr key={f.id} className={overdue ? 'bg-red-50 hover:bg-red-100' : ''}>
                                            <td><div className="font-bold text-gray-800">{f.customer}</div><div className="text-xs text-gray-500 dir-ltr text-right">{f.phone}</div></td>
                                            <td><span className="px-2 py-1 bg-gray-100 text-gray-700 rounded text-xs border">{f.type}</span></td>
                                            <td className="text-gray-600 max-w-[150px] truncate" title={f.reason}>{f.reason}</td>
                                            <td>
                                                <span className={`font-bold ${overdue ? 'text-red-600' : 'text-brand'}`}>{f.targetDate || '-'}</span>
                                                {overdue && <span className="block text-[10px] text-red-500 font-bold">متأخرة!</span>}
                                            </td>
                                            <td>
                                                <select className={`px-2 py-1.5 rounded text-xs font-bold border cursor-pointer outline-none ${f.status==='جديدة'?'bg-blue-50 text-blue-700 border-blue-200':f.status==='قيد المتابعة'?'bg-yellow-50 text-yellow-700 border-yellow-200':f.status==='مكتملة'?'bg-green-50 text-green-700 border-green-200':'bg-gray-100 text-gray-700 border-gray-300'}`} value={f.status} onChange={(e) => handleStatusChange(f.id, e.target.value)}>
                                                    <option>جديدة</option><option>قيد المتابعة</option><option>مؤجلة</option><option>مكتملة</option>
                                                </select>
                                            </td>
                                            <td>
                                                <div className="flex gap-2 items-center flex-wrap">
                                                    <button onClick={() => handleOpenDetails(f)} className="text-gray-600 hover:text-brand font-bold text-xs bg-gray-100 px-2 py-1.5 rounded border border-gray-300">التفاصيل</button>
                                                    <button onClick={() => handleOpenEdit(f)} className="text-brand hover:text-blue-800 font-bold text-xs bg-blue-50 px-2 py-1.5 rounded border border-blue-200">تعديل</button>
                                                    <button onClick={() => handleDelete(f.id)} className="text-red-600 hover:text-red-800 font-bold text-xs bg-red-50 px-2 py-1.5 rounded border border-red-200"><Icons.Trash /></button>
                                                </div>
                                            </td>
                                        </tr>
                                    )})}
                                    {filteredData.length === 0 && <tr><td colSpan="6" className="text-center py-8 text-gray-500 font-bold text-lg">لا توجد بيانات حالياً</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <Modal title={isEditing ? 'تعديل المتابعة' : 'إضافة متابعة جديدة'} isOpen={showFormModal} onClose={() => setShowFormModal(false)}>
                        <div className="space-y-4">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label className="block text-sm font-medium mb-1">اسم العميل *</label><input type="text" className="w-full border p-2 rounded" value={formData.customer} onChange={e=>setFormData({...formData, customer: e.target.value})} /></div>
                                <div><label className="block text-sm font-medium mb-1">رقم الهاتف *</label><input type="text" className="w-full border p-2 rounded" value={formData.phone} onChange={e=>setFormData({...formData, phone: e.target.value})} dir="ltr" /></div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">نوع المتابعة</label>
                                    <select className="w-full border p-2 rounded" value={formData.type} onChange={e=>setFormData({...formData, type: e.target.value})}>
                                        <option>متابعة رضا العميل</option><option>تذكير تغيير زيت</option><option>عرض خاص</option><option>متابعة خدمة مؤجلة</option><option>متابعة عميل غير نشط</option><option>متابعة شكوى</option>
                                    </select>
                                </div>
                                <div><label className="block text-sm font-medium mb-1">تاريخ الاستهداف للتنفيذ</label><input type="date" className="w-full border p-2 rounded" value={formData.targetDate} onChange={e=>setFormData({...formData, targetDate: e.target.value})} /></div>
                                <div className="sm:col-span-2"><label className="block text-sm font-medium mb-1">السبب الأساسي</label><input type="text" className="w-full border p-2 rounded" value={formData.reason} onChange={e=>setFormData({...formData, reason: e.target.value})} /></div>
                                <div className="sm:col-span-2"><label className="block text-sm font-medium mb-1">ملاحظات داخلية</label><textarea className="w-full border p-2 rounded h-20" value={formData.notes} onChange={e=>setFormData({...formData, notes: e.target.value})}></textarea></div>
                            </div>
                            <div className="flex justify-end gap-3 pt-4 border-t mt-4">
                                <button onClick={() => setShowFormModal(false)} className="px-5 py-2 bg-gray-200 rounded font-bold">إلغاء</button>
                                <button onClick={handleSaveForm} className="px-5 py-2 bg-brand text-white rounded font-bold shadow-md hover:bg-blue-700">حفظ المتابعة</button>
                            </div>
                        </div>
                    </Modal>

                    <Modal title={`تفاصيل بطاقة المتابعة`} isOpen={showDetailsModal} onClose={() => setShowDetailsModal(false)}>
                        <div className="space-y-4 text-sm">
                            <div className="bg-gray-50 p-4 rounded-lg border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <div><h4 className="font-bold text-xl text-brand">{formData.customer}</h4><p className="text-gray-500 font-bold mt-1" dir="ltr">{formData.phone}</p></div>
                                <div><span className={`px-4 py-2 rounded-lg text-sm font-bold border ${formData.status==='جديدة'?'bg-blue-50 text-blue-700 border-blue-200':formData.status==='قيد المتابعة'?'bg-yellow-50 text-yellow-700 border-yellow-200':formData.status==='مكتملة'?'bg-green-50 text-green-700 border-green-200':'bg-gray-100 text-gray-700 border-gray-300'}`}>{formData.status}</span></div>
                            </div>
                            <div className="grid grid-cols-2 gap-4 border-b pb-4">
                                <div><span className="block text-xs text-gray-500">نوع المتابعة</span><span className="font-bold text-base">{formData.type}</span></div>
                                <div><span className="block text-xs text-gray-500">تاريخ الاستهداف</span><span className="font-bold text-red-600 text-base">{formData.targetDate || '-'}</span></div>
                                <div className="col-span-2"><span className="block text-xs text-gray-500">السبب الأساسي</span><span className="font-bold text-base text-gray-800">{formData.reason || '-'}</span></div>
                            </div>
                            <div><span className="block font-bold text-gray-700 mb-2">ملاحظات ونتائج التواصل:</span><div className="bg-yellow-50 p-4 rounded-lg border border-yellow-200 text-gray-800 min-h-[80px] leading-relaxed whitespace-pre-wrap">{formData.notes || <span className="text-gray-400 italic">لا توجد ملاحظات.</span>}</div></div>
                            <div className="flex justify-end gap-3 pt-4 border-t mt-4">
                                <button onClick={() => { setShowDetailsModal(false); window.open(generateWhatsAppLink(formData.phone), '_blank'); addToast("تم فتح تطبيق WhatsApp", "success"); }} className="px-5 py-2 bg-green-500 text-white rounded font-bold flex items-center gap-2 hover:bg-green-600 shadow-md"><Icons.Message /> إرسال عبر WhatsApp</button>
                                <button onClick={() => setShowDetailsModal(false)} className="px-5 py-2 border border-gray-300 rounded font-bold hover:bg-gray-50">إغلاق التقرير</button>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        };

        // 6. Communication
        const Communication = ({ db, updateDb, addToast }) => {
            const [activeTab, setActiveTab] = useState('queue');
            const [selectedQueueItem, setSelectedQueueItem] = useState(null);
            const [contactForm, setContactForm] = useState({ result: 'تم الرد', rating: 0, comment: '', recommend: 'نعم', needsFollowUp: false, notes: '' });
            
            const [manualPhone, setManualPhone] = useState('');
            const [manualMsg, setManualMsg] = useState('');
            const [selectedTemplate, setSelectedTemplate] = useState('');

            const queue = db.communicationQueue.filter(q => q.status !== 'مكتمل');

            const openContactForm = (item) => {
                setSelectedQueueItem(item);
                setContactForm({ result: 'تم الرد', rating: 0, comment: '', recommend: 'نعم', needsFollowUp: false, notes: '' });
            };

            const handleDelete = (id) => {
                if(window.confirm('هل أنت متأكد من إزالة هذه المهمة من القائمة؟')){
                    updateDb('communicationQueue', db.communicationQueue.filter(q => q.id !== id));
                    addToast('تم حذف المهمة بنجاح', 'success');
                }
            };

            const handleSaveContactResult = () => {
                const { rating, result, comment, recommend, needsFollowUp, notes } = contactForm;
                const updatedQueue = db.communicationQueue.map(q => q.id === selectedQueueItem.id ? {...q, status: 'مكتمل'} : q);
                
                let newFeedback = [...db.feedback];
                let newFollowUps = [...db.followUps];

                if (rating > 0 && result === 'تم الرد') {
                    newFeedback.push({ id: Date.now(), customer: selectedQueueItem.customerName, orderId: '-', date: new Date().toLocaleDateString('ar-IQ'), rating, comment, goodExp: rating >=3?'نعم':'لا', recommend, status: rating<=2?'يحتاج متابعة':'مغلق' });
                }

                if ((rating > 0 && rating <= 2) || needsFollowUp) {
                    newFollowUps.push({ id: Date.now()+1, customer: selectedQueueItem.customerName, phone: selectedQueueItem.phone, type: 'متابعة شكوى', reason: 'متابعة بناءً على اتصال خدمة العملاء', date: new Date().toLocaleDateString('ar-IQ'), targetDate: new Date().toLocaleDateString('en-CA'), emp: 'المدير', status: 'جديدة', notes: notes });
                    addToast("تم حفظ التقييم وتم توليد مهمة متابعة عاجلة للإدارة!", "error");
                } else {
                    addToast("تم حفظ النتيجة وإغلاق مهمة التواصل بنجاح.", "success");
                }

                updateDb('communicationQueue', updatedQueue);
                updateDb('feedback', newFeedback);
                updateDb('followUps', newFollowUps);
                setSelectedQueueItem(null);
            };

            const applyTemplateVars = (text, cust) => {
                let res = text;
                res = res.replace(/\[اسم العميل\]/g, cust?.name ? cust.name.split(' ')[0] : '');
                res = res.replace(/\[نوع السيارة\]/g, cust?.vehicleType || '');
                res = res.replace(/\[آخر زيارة\]/g, cust?.lastVisit || '');
                return res;
            };

            const handleTemplateSelect = (e) => {
                const tId = parseInt(e.target.value);
                setSelectedTemplate(e.target.value);
                const tmpl = db.templates.find(t => t.id === tId);
                if (tmpl) {
                    let msg = tmpl.text;
                    if (tmpl.useGreeting && !msg.includes('مرحبا')) {
                        msg = `مرحبا [اسم العميل]،\n${msg}`;
                    }
                    const cust = db.customers.find(c => c.phone === manualPhone);
                    setManualMsg(applyTemplateVars(msg, cust));
                }
            };

            useEffect(() => {
                if(selectedTemplate) {
                    const tmpl = db.templates.find(t => t.id === parseInt(selectedTemplate));
                    const cust = db.customers.find(c => c.phone === manualPhone);
                    if(tmpl) {
                        let msg = tmpl.text;
                        if (tmpl.useGreeting && !msg.includes('مرحبا')) msg = `مرحبا [اسم العميل]،\n${msg}`;
                        setManualMsg(applyTemplateVars(msg, cust));
                    }
                }
            }, [manualPhone, selectedTemplate, db.customers, db.templates]);

            const handleManualWhatsApp = () => {
                if(!manualPhone) return addToast("يرجى اختيار العميل أولاً", "error");
                if(!manualMsg) return addToast("نص الرسالة فارغ", "error");
                window.open(generateWhatsAppLink(manualPhone, manualMsg), '_blank');
                addToast("تم التوجيه للواتساب", "success");
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end border-b pb-2 gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">العملاء المطلوب التواصل معهم (الأتمتة الذكية)</h2>
                        <div className="flex gap-2 w-full sm:w-auto">
                            <button onClick={()=>setActiveTab('queue')} className={`flex-1 sm:flex-none px-4 py-2 font-bold rounded-t-lg ${activeTab==='queue'?'bg-brand text-white':'bg-gray-200 text-gray-600'}`}>قائمة المهام</button>
                            <button onClick={()=>setActiveTab('manual')} className={`flex-1 sm:flex-none px-4 py-2 font-bold rounded-t-lg ${activeTab==='manual'?'bg-brand text-white':'bg-gray-200 text-gray-600'}`}>مراسلة حرة</button>
                        </div>
                    </div>

                    {activeTab === 'queue' ? (
                        <div className="animate-fade-in space-y-4">
                            <div className="bg-blue-50 border border-blue-200 p-4 rounded-xl flex flex-wrap gap-4 text-blue-900 text-sm font-bold">
                                <p className="bg-white px-3 py-1 rounded shadow-sm">إجمالي المهام المعلقة: {queue.length}</p>
                                <p className="bg-white px-3 py-1 rounded shadow-sm">تقييم مطلوب: {queue.filter(q=>q.type==='رضا العميل').length}</p>
                                <p className="bg-white px-3 py-1 rounded shadow-sm">تذكير زيت: {queue.filter(q=>q.type.includes('زيت')).length}</p>
                            </div>

                            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-right crm-table">
                                        <thead className="bg-gray-100"><tr><th>اسم العميل</th><th>رقم الهاتف</th><th>السيارة</th><th>آخر زيارة</th><th>السبب</th><th>الأولوية</th><th>الإجراءات</th></tr></thead>
                                        <tbody>
                                            {queue.map(q => (
                                                <tr key={q.id}>
                                                    <td className="font-bold text-gray-900">{q.customerName}</td><td dir="ltr" className="text-right">{q.phone}</td>
                                                    <td>{q.vehicle}</td><td>{q.lastVisit}</td><td className="font-bold text-brand">{q.reason}</td>
                                                    <td><span className={`px-2 py-1 rounded text-xs ${q.priority==='عالية'?'bg-red-100 text-red-700':'bg-gray-200'}`}>{q.priority}</span></td>
                                                    <td>
                                                        <div className="flex gap-2">
                                                            <button onClick={()=>openContactForm(q)} className="bg-brand text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-blue-700 shadow-sm">تواصل</button>
                                                            <button onClick={()=>{ window.open(generateWhatsAppLink(q.phone),'_blank'); addToast("تم فتح الواتساب","success"); }} className="bg-green-500 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-green-600 shadow-sm flex items-center"><Icons.Message /></button>
                                                            <button onClick={()=>handleDelete(q.id)} className="bg-red-50 text-red-600 px-3 py-1.5 rounded text-xs font-bold hover:bg-red-100 shadow-sm border border-red-200"><Icons.Trash /></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                            {queue.length === 0 && <tr><td colSpan="7" className="text-center p-12 text-gray-500 font-bold text-xl">عمل رائع! تم إنجاز كافة مهام التواصل لليوم.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <Modal title={`فورمة نتيجة التواصل: ${selectedQueueItem?.customerName}`} isOpen={!!selectedQueueItem} onClose={()=>setSelectedQueueItem(null)}>
                                {selectedQueueItem && (
                                    <div className="space-y-5">
                                        <div className="bg-gray-50 p-4 rounded border text-sm flex justify-between items-center">
                                            <div><p className="text-gray-500 text-xs">العميل المستهدف:</p><p className="font-bold text-lg">{selectedQueueItem.customerName}</p></div>
                                            <div className="text-left"><p className="text-gray-500 text-xs">السبب:</p><p className="font-bold text-brand">{selectedQueueItem.reason}</p></div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-bold mb-1">نتيجة التواصل *</label>
                                                <select className="w-full border p-3 rounded bg-white shadow-sm" value={contactForm.result} onChange={e=>setContactForm({...contactForm, result:e.target.value})}>
                                                    <option>تم الرد</option><option>لم يرد</option><option>مغلق / غير متاح</option><option>تم التأجيل</option>
                                                </select>
                                            </div>
                                            {contactForm.result === 'تم الرد' && (
                                                <div className="bg-yellow-50 p-3 rounded border border-yellow-200 flex flex-col justify-center items-center">
                                                    <label className="block text-xs font-bold mb-1 text-yellow-800">تقييم العميل للخدمة (1-5)</label>
                                                    <div className="flex gap-2 text-3xl cursor-pointer">
                                                        {[1,2,3,4,5].map(star => (
                                                            <span key={star} onClick={()=>setContactForm({...contactForm, rating:star})} className={star <= contactForm.rating ? 'text-yellow-400' : 'text-gray-300 hover:text-yellow-200'}>★</span>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {contactForm.result === 'تم الرد' && (
                                            <div className="space-y-4 animate-fade-in border-t pt-4">
                                                <div><label className="block text-sm font-bold mb-1">رأي العميل وما قاله حرفياً</label><textarea className="w-full border p-3 rounded h-24 bg-white shadow-sm" placeholder="اكتب تفاصيل المحادثة هنا..." value={contactForm.comment} onChange={e=>setContactForm({...contactForm, comment:e.target.value})}></textarea></div>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                    <div><label className="block text-sm font-bold mb-1">هل ينصح بالورشة؟</label><select className="w-full border p-3 rounded bg-white shadow-sm" value={contactForm.recommend} onChange={e=>setContactForm({...contactForm, recommend:e.target.value})}><option>نعم</option><option>لا</option></select></div>
                                                    <div className="flex items-center"><label className="flex items-center gap-2 text-sm font-bold cursor-pointer bg-red-50 p-3 rounded border border-red-200 w-full"><input type="checkbox" className="w-5 h-5 text-red-600 rounded" checked={contactForm.needsFollowUp} onChange={e=>setContactForm({...contactForm, needsFollowUp:e.target.checked})} /> العميل مستاء ويحتاج لمتابعة الإدارة</label></div>
                                                </div>
                                            </div>
                                        )}

                                        <div><label className="block text-sm font-bold mb-1">ملاحظات الموظف الداخلية (للسجل)</label><input type="text" className="w-full border p-3 rounded bg-gray-50 shadow-sm" value={contactForm.notes} onChange={e=>setContactForm({...contactForm, notes:e.target.value})} /></div>

                                        <div className="flex flex-col sm:flex-row justify-end gap-3 pt-4 border-t mt-4">
                                            <button onClick={()=>setSelectedQueueItem(null)} className="px-6 py-3 bg-gray-200 rounded font-bold w-full sm:w-auto">إلغاء</button>
                                            <button onClick={handleSaveContactResult} className="px-6 py-3 bg-brand text-white rounded font-bold shadow-md hover:bg-blue-700 w-full sm:w-auto flex justify-center items-center gap-2"><Icons.Check/> حفظ وتحديث السجل</button>
                                        </div>
                                    </div>
                                )}
                            </Modal>
                        </div>
                    ) : (
                        <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-5 max-w-2xl animate-fade-in">
                            <h3 className="font-bold text-lg mb-4 border-b pb-2">إرسال رسالة يدوية سريعة</h3>
                            <div><label className="block text-sm font-bold mb-1">العميل المستهدف *</label><select className="w-full border p-3 rounded bg-gray-50 focus:bg-white" value={manualPhone} onChange={e=>setManualPhone(e.target.value)}><option value="">-- اختر العميل --</option>{db.customers.map(c => <option key={c.id} value={c.phone}>{c.name} ({c.phone})</option>)}</select></div>
                            <div>
                                <label className="block text-sm font-bold mb-1 text-gray-700">قالب الرسالة (اختياري)</label>
                                <select className="w-full border p-3 rounded bg-gray-50 focus:bg-white mb-2" value={selectedTemplate} onChange={handleTemplateSelect}>
                                    <option value="">-- كتابة رسالة مخصصة --</option>
                                    {db.templates.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                                </select>
                                <textarea className="w-full border rounded p-3 bg-gray-50 focus:bg-white h-32 leading-relaxed" placeholder="اكتب رسالتك هنا..." value={manualMsg} onChange={e=>setManualMsg(e.target.value)}></textarea>
                            </div>
                            <div className="pt-4 border-t"><button onClick={handleManualWhatsApp} className="w-full sm:w-auto bg-green-500 text-white px-8 py-3 rounded-lg font-bold hover:bg-green-600 shadow-md flex items-center justify-center gap-2"><Icons.Message/> إرسال عبر WhatsApp</button></div>
                        </div>
                    )}
                </div>
            );
        };

        // 7. Feedback
        const Feedback = ({ db, updateDb, addToast }) => {
            const handleDelete = (id) => {
                if(window.confirm('هل أنت متأكد من الحذف؟')){
                    updateDb('feedback', db.feedback.filter(f => f.id !== id));
                    addToast('تم الحذف بنجاح', 'success');
                }
            };
            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">التقارير والفيدباك</h2>
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-right crm-table">
                                <thead><tr><th>التاريخ</th><th>العميل</th><th>التقييم</th><th>التعليق المكتوب</th><th>التوصية</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
                                <tbody>
                                    {db.feedback.map(fb => (
                                        <tr key={fb.id} className={fb.rating <= 2 ? 'bg-red-50' : fb.rating >= 4 ? 'bg-green-50/30' : ''}>
                                            <td className="font-medium">{fb.date}</td><td className="font-bold text-gray-800">{fb.customer}</td>
                                            <td><div className="flex text-yellow-400 text-lg">{[...Array(5)].map((_, i) => <span key={i} className={i<fb.rating?'text-yellow-400':'text-gray-300'}>★</span>)}</div></td>
                                            <td className="max-w-md truncate whitespace-normal leading-relaxed" title={fb.comment}>{fb.comment || '-'}</td>
                                            <td><span className={`px-2 py-1 rounded text-xs font-bold ${fb.recommend==='نعم'?'bg-green-100 text-green-800':'bg-red-100 text-red-800'}`}>{fb.recommend}</span></td>
                                            <td><span className={`px-2 py-1 rounded text-xs font-bold ${fb.status==='مغلق'?'bg-gray-200 text-gray-700':'bg-red-100 text-red-700'}`}>{fb.status}</span></td>
                                            <td><button onClick={()=>handleDelete(fb.id)} className="text-red-600 bg-red-50 px-2 py-1 rounded border border-red-200"><Icons.Trash /></button></td>
                                        </tr>
                                    ))}
                                    {db.feedback.length === 0 && <tr><td colSpan="7" className="text-center p-8 text-gray-500 font-bold">لا توجد بيانات حالياً</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // 8. Offers
        const Offers = ({ db, updateDb, addToast }) => {
            const [showModal, setShowModal] = useState(false);
            const [step, setStep] = useState(1);
            const [campaignData, setCampaignData] = useState({ title: '', text: '', target: 'الكل', type: 'خصم تبديل زيت' });
            const [selectedTemplate, setSelectedTemplate] = useState('');
            const [filteredCustomers, setFilteredCustomers] = useState([]);
            const [selectedCustomerIds, setSelectedCustomerIds] = useState([]);

            const applyTemplateVars = (text, cust) => {
                let res = text;
                res = res.replace(/\[اسم العميل\]/g, cust?.name ? cust.name.split(' ')[0] : '');
                res = res.replace(/\[نوع السيارة\]/g, cust?.vehicleType || '');
                res = res.replace(/\[آخر زيارة\]/g, cust?.lastVisit || '');
                return res;
            };

            const handleTemplateSelect = (e) => {
                const tId = parseInt(e.target.value);
                setSelectedTemplate(e.target.value);
                const tmpl = db.templates.find(t => t.id === tId);
                if (tmpl) {
                    let msg = tmpl.text;
                    if (tmpl.useGreeting && !msg.includes('مرحبا')) msg = `مرحبا [اسم العميل]،\n${msg}`;
                    setCampaignData({...campaignData, text: msg});
                }
            };

            const handleNextStep = () => {
                if(!campaignData.title || !campaignData.text) return addToast("الرجاء إدخال اسم الحملة ونص الرسالة", "error");
                let matched = db.customers;
                if (campaignData.target === 'العملاء VIP') matched = db.customers.filter(c => c.segment === 'VIP');
                else if (campaignData.target === 'العملاء الدائمون') matched = db.customers.filter(c => c.segment === 'عميل دائم');
                else if (campaignData.target === 'العملاء الجدد (زيارة واحدة)') matched = db.customers.filter(c => c.segment === 'عميل جديد');
                
                setFilteredCustomers(matched);
                setSelectedCustomerIds(matched.map(c => c.id));
                setStep(2);
            };

            const handleSendSelected = () => {
                if(selectedCustomerIds.length === 0) return addToast("الرجاء تحديد عميل واحد على الأقل", "error");
                updateDb('offers', [{ id: Date.now(), title: campaignData.title, type: campaignData.type, targetCount: selectedCustomerIds.length, revenue: 0, status: 'نشط' }, ...db.offers]);
                setShowModal(false); setStep(1);

                            <div className="space-y-5">

                                    <div><label className="block text-sm font-bold mb-1 text-gray-700">نوع العرض</label><select className="w-full border p-3 rounded bg-gray-50 focus:bg-white" value={campaignData.type} onChange={e=>setCampaignData({...campaignData, type:e.target.value})}><option>خصم تبديل زيت</option><option>عرض فحص مجاني</option><option>خصم صيانة شاملة</option></select></div>
                                    <div className="sm:col-span-2"><label className="block text-sm font-bold mb-1 text-gray-700">الاستهداف الذكي *</label><select className="w-full border p-3 rounded bg-gray-50 focus:bg-white" value={campaignData.target} onChange={e=>setCampaignData({...campaignData, target:e.target.value})}><option>الكل (جميع العملاء المسجلين)</option><option>العملاء الدائمون</option><option>العملاء VIP</option><option>العملاء الجدد (زيارة واحدة)</option></select></div>
                                    <div className="sm:col-span-2">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="block text-sm font-bold text-gray-700">محتوى الرسالة (SMS/WhatsApp) *</label>
                                            <select className="border text-xs rounded p-1 text-gray-600 bg-white" value={selectedTemplate} onChange={handleTemplateSelect}>
                                                <option value="">-- تحميل من قالب --</option>
                                                {db.templates.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                                            </select>
                                        </div>
                                        <textarea className="w-full border p-4 rounded h-32 bg-gray-50 focus:bg-white text-sm leading-relaxed" placeholder="اكتب عرضك الترويجي هنا (سيتم إضافة اسم العميل آلياً في البداية)..." value={campaignData.text} onChange={e=>setCampaignData({...campaignData, text:e.target.value})}></textarea>

                                <div className="flex justify-end gap-3 pt-5 border-t mt-5">
                                    <button onClick={() => setShowModal(false)} className="px-6 py-2.5 bg-gray-200 text-gray-800 rounded font-bold hover:bg-gray-300 transition-colors">إلغاء الأمر</button>

                                </div>
                            </div>

                    </Modal>
