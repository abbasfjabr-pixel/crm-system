        }

        // 9. Reports (Fully upgraded with sections and print)
        const Reports = ({ db, addToast }) => {
            const [showExportPreview, setShowExportPreview] = useState(false);
            const [exportFormat, setExportFormat] = useState('pdf');

            // Dynamic Report Calculations
            const allServices = db.workOrders.flatMap(wo => wo.detailedServices || []);
            const oilChanges = allServices.filter(s => s.name === 'زيت المحرك');
            
            const oilTypesCount = {};
            oilChanges.forEach(s => { const t = s.details; if(t) oilTypesCount[t] = (oilTypesCount[t]||0)+1; });
            const topOil = Object.keys(oilTypesCount).length > 0 ? Object.keys(oilTypesCount).reduce((a, b) => oilTypesCount[a] > oilTypesCount[b] ? a : b) : 'لا يوجد';

            const servicesCount = {};
            allServices.forEach(s => { servicesCount[s.name] = (servicesCount[s.name]||0)+1; });
            const topService = Object.keys(servicesCount).length > 0 ? Object.keys(servicesCount).reduce((a, b) => servicesCount[a] > servicesCount[b] ? a : b) : 'لا توجد بيانات';

            const totalRev = db.workOrders.reduce((sum, wo) => sum + wo.total, 0);
            const contactedCusts = [...db.feedback.map(f=>({name: f.customer, res: f.status, rating: f.rating, comment: f.comment}))];

            const handleExportConfirm = () => {
                setShowExportPreview(false);
                if (exportFormat === 'excel') {
                    const headers = ["القسم", "البيان", "القيمة"];
                    const rows = [ 
                        ["الخلاصة", "عدد السيارات الزائرة", db.workOrders.length],
                        ["الخلاصة", "عدد مرات تغيير الزيت", oilChanges.length],
                        ["الخلاصة", "أكثر زيت مبيعاً", topOil],
                        ["الإيرادات", "المجموع الصافي", totalRev],
                    ];
                    exportToExcelCSV(`تقرير_اسبوعي_${new Date().toISOString().split('T')[0]}.csv`, headers, rows);
                    addToast("تم تصدير ملف Excel بنجاح", "success");
                } else {
                    addToast("جاري إعداد التقرير للطباعة...", "success");
                    window.print();
                }
            };

            return (
                <div className="space-y-6 max-w-5xl mx-auto">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">التقارير الإدارية المتقدمة</h2>
                        <div className="flex gap-2 w-full sm:w-auto">
                            <button onClick={() => { setExportFormat('excel'); setShowExportPreview(true); }} className="flex-1 sm:flex-none border-2 border-green-600 text-green-700 bg-white px-4 py-2 rounded-lg font-bold hover:bg-green-50 flex items-center justify-center gap-2"><Icons.Download /> تصدير Excel</button>
                            <button onClick={() => { setExportFormat('pdf'); setShowExportPreview(true); }} className="flex-1 sm:flex-none border-2 border-brand text-brand bg-white px-4 py-2 rounded-lg font-bold hover:bg-blue-50 flex items-center justify-center gap-2"><Icons.FileText /> طباعة التقرير / PDF</button>
                        </div>
                    </div>
                    
                    <div id="printable-area" className="bg-white p-8 rounded-xl shadow-sm border border-gray-200 space-y-8 print:shadow-none print:border-none print:p-0">
                        <div className="text-center border-b-4 border-gray-800 pb-6">
                            <h1 className="text-3xl font-black text-gray-900 tracking-wide">هندسة السيارات</h1>
                            <p className="text-xl text-gray-800 font-bold mt-2">تقرير الإدارة الأسبوعي الشامل</p>
                            <p className="text-sm text-gray-500 mt-1">تاريخ التقرير: {new Date().toLocaleDateString('ar-IQ')} | جميع البيانات مستخرجة آلياً</p>
                        </div>

                        {/* SECTION 1 */}
                        <div className="space-y-4 print-break-inside-avoid">
                            <h3 className="text-xl font-bold text-brand bg-blue-50 p-3 rounded-lg border border-blue-200 shadow-sm">1. الخلاصة العامة</h3>
                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                <div className="p-4 border-2 border-gray-200 rounded-xl bg-gray-50 text-center"><span className="text-gray-500 block text-sm font-bold mb-1">السيارات الزائرة</span><span className="font-black text-2xl text-blue-600">{db.workOrders.length}</span></div>
                                <div className="p-4 border-2 border-gray-200 rounded-xl bg-gray-50 text-center"><span className="text-gray-500 block text-sm font-bold mb-1">خدمات تبديل الزيت</span><span className="font-black text-2xl text-yellow-600">{oilChanges.length}</span></div>
                                <div className="p-4 border-2 border-gray-200 rounded-xl bg-gray-50 text-center"><span className="text-gray-500 block text-sm font-bold mb-1">أكثر زيت مبيعاً</span><span className="font-black text-xl text-gray-800">{topOil}</span></div>
                                <div className="p-4 border-2 border-gray-200 rounded-xl bg-gray-50 text-center"><span className="text-gray-500 block text-sm font-bold mb-1">أكثر خدمة طلباً</span><span className="font-black text-xl text-gray-800">{topService}</span></div>
                            </div>
                        </div>

                        {/* SECTION 2 */}
                        <div className="space-y-4 print-break-inside-avoid">
                            <h3 className="text-xl font-bold text-brand bg-blue-50 p-3 rounded-lg border border-blue-200 shadow-sm">2. جدول العملاء المستفيدين (الأحدث)</h3>
                            <table className="w-full text-right border-collapse border-2 border-gray-300 text-sm">
                                <thead className="bg-gray-100"><tr><th className="p-2 border border-gray-300">اسم العميل</th><th className="p-2 border border-gray-300">السيارة</th><th className="p-2 border border-gray-300 text-center">الزيارات (تاريخي)</th><th className="p-2 border border-gray-300">مبلغ الفاتورة</th></tr></thead>
                                <tbody>
                                    {db.workOrders.slice(0,5).map(wo => {
                                        const cust = db.customers.find(c=>c.name === wo.customerName);
                                        return <tr key={wo.id}><td className="p-2 border border-gray-300 font-bold">{wo.customerName}</td><td className="p-2 border border-gray-300">{wo.vehicle}</td><td className="p-2 border border-gray-300 text-center font-bold">{cust?.visitsCount||1}</td><td className="p-2 border border-gray-300 font-bold text-green-600">{formatMoney(wo.total)}</td></tr>
                                    })}
                                    {db.workOrders.length === 0 && <tr><td colSpan="4" className="p-4 text-center font-bold text-gray-500">لا توجد بيانات حالياً</td></tr>}
                                </tbody>
                            </table>
                        </div>

                        {/* SECTION 3 */}
                        <div className="space-y-4 print-break-inside-avoid">
                            <h3 className="text-xl font-bold text-brand bg-blue-50 p-3 rounded-lg border border-blue-200 shadow-sm">3. العملاء الذين تم التواصل معهم (آخر التقييمات)</h3>
                            <table className="w-full text-right border-collapse border-2 border-gray-300 text-sm">
                                <thead className="bg-gray-100"><tr><th className="p-2 border border-gray-300">الاسم</th><th className="p-2 border border-gray-300">الحالة / النتيجة</th><th className="p-2 border border-gray-300 text-center">التقييم</th><th className="p-2 border border-gray-300">رأي العميل</th></tr></thead>
                                <tbody>
                                    {contactedCusts.map((c,i) => <tr key={i}><td className="p-2 border border-gray-300 font-bold">{c.name}</td><td className="p-2 border border-gray-300">{c.res}</td><td className="p-2 border border-gray-300 text-center text-yellow-500 font-bold">{c.rating}★</td><td className="p-2 border border-gray-300">{c.comment||'-'}</td></tr>)}
                                    {contactedCusts.length===0 && <tr><td colSpan="4" className="p-4 text-center font-bold text-gray-500">لا توجد بيانات حالياً</td></tr>}
                                </tbody>
                            </table>
                        </div>

                        {/* SECTION 4 & 5 Layout */}
                        <div className="flex flex-col sm:flex-row gap-8 print-break-inside-avoid">
                            <div className="w-full sm:w-1/2 space-y-4">
                                <h3 className="text-xl font-bold text-brand bg-blue-50 p-3 rounded-lg border border-blue-200 shadow-sm">4. الخدمات الأكثر مبيعاً</h3>
                                <table className="w-full text-right border-collapse border-2 border-gray-300 text-sm">
                                    <thead className="bg-gray-100"><tr><th className="p-2 border border-gray-300">اسم الخدمة</th><th className="p-2 border border-gray-300 text-center">عدد المرات</th></tr></thead>
                                    <tbody>
                                        {Object.keys(servicesCount).length > 0 ? Object.entries(servicesCount).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([name, count], i) => <tr key={i}><td className="p-2 border border-gray-300 font-bold">{name}</td><td className="p-2 border border-gray-300 text-center font-bold">{count}</td></tr>) : <tr><td colSpan="2" className="p-4 text-center font-bold text-gray-500">لا توجد بيانات حالياً</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                            <div className="w-full sm:w-1/2 space-y-4">
                                <h3 className="text-xl font-bold text-brand bg-blue-50 p-3 rounded-lg border border-blue-200 shadow-sm">5. ملخص الإيرادات</h3>
                                <table className="w-full text-right border-collapse border-2 border-gray-300 text-sm">
                                    <tbody>
                                        <tr><th className="p-3 border border-gray-300 bg-gray-50">إجمالي الإيرادات</th><td className="p-3 border border-gray-300 font-bold">{formatMoney(totalRev)}</td></tr>
                                        <tr><th className="p-3 border border-gray-300 bg-gray-50 text-red-600">الخصومات الممنوحة</th><td className="p-3 border border-gray-300 font-bold text-red-600">{formatMoney(0)}</td></tr>
                                        <tr><th className="p-3 border border-gray-800 bg-gray-800 text-white text-lg">الصافي الكلي</th><td className="p-3 border border-gray-800 font-black text-xl bg-gray-100">{formatMoney(totalRev)}</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <Modal title="نافذة تأكيد تصدير التقرير الإداري" isOpen={showExportPreview} onClose={() => setShowExportPreview(false)} size="max-w-md">
                        <div className="space-y-5">
                            <div className="bg-gray-50 p-5 rounded-xl border border-gray-200 text-sm leading-relaxed text-gray-700">
                                <h4 className="font-bold text-gray-900 mb-3 text-lg">معلومات الملف الجاهز للتصدير</h4>
                                <p><strong>اسم التقرير:</strong> تقرير الأداء الشامل الموحد</p>
                                <p><strong>تاريخ الإصدار:</strong> {new Date().toLocaleDateString('ar-IQ')}</p>
                                <p><strong>الجداول والأقسام:</strong> الإيرادات، الزيارات، التوصيات الذكية</p>
                            </div>
                            <div>
                                <label className="block text-sm font-bold mb-3 text-gray-800">الصيغة المطلوبة:</label>
                                <div className="flex gap-4">
                                    <label className="flex-1 flex items-center justify-center gap-2 cursor-pointer border-2 p-3 rounded-lg hover:bg-green-50">
                                        <input type="radio" name="reportFormat" value="excel" checked={exportFormat === 'excel'} onChange={() => setExportFormat('excel')} className="text-green-600" /> <span className="font-bold text-green-800">Excel (.csv)</span>
                                    </label>
                                    <label className="flex-1 flex items-center justify-center gap-2 cursor-pointer border-2 p-3 rounded-lg hover:bg-brand hover:bg-opacity-10">
                                        <input type="radio" name="reportFormat" value="pdf" checked={exportFormat === 'pdf'} onChange={() => setExportFormat('pdf')} className="text-brand" /> <span className="font-bold text-brand">معاينة / طباعة PDF</span>
                                    </label>
                                </div>
                            </div>
                            <div className="flex justify-end gap-3 pt-5 border-t mt-6">
                                <button onClick={() => setShowExportPreview(false)} className="px-6 py-2.5 bg-gray-200 rounded font-bold">تراجع</button>
                                <button onClick={handleExportConfirm} className="px-6 py-2.5 bg-brand text-white rounded font-bold shadow-md hover:bg-blue-700 flex items-center gap-2"><Icons.Download /> اعتماد واستخراج</button>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        };

        // 10. Users
        const Users = ({ db, updateDb, addToast }) => {
            const emptyUserForm = { name: '', username: '', password: '', role: 'موظف الاستقبال', phone: '', email: '', status: 'نشط' };
            const [showModal, setShowModal] = useState(false);
            const [editingUserId, setEditingUserId] = useState(null);
            const [userForm, setUserForm] = useState(emptyUserForm);
            const permissionsModules = ['لوحة التحكم','العملاء','ورقة العمل','الزيارات','المتابعات','التواصل','التقييمات','العروض','التقارير','المستخدمين','الإعدادات'];

            const openAddUser = () => {
                setEditingUserId(null);
                setUserForm(emptyUserForm);
                setShowModal(true);
            };

            const openEditUser = (user) => {
                setEditingUserId(user.id);
                setUserForm({
                    name: user.name || '',
                    username: user.username || '',
                    password: user.password || '',
                    role: user.role || 'موظف الاستقبال',
                    phone: user.phone || '',
                    email: user.email || '',
                    status: user.status || 'نشط'
                });
                setShowModal(true);
            };

            const handleSaveUser = () => {
                if(!userForm.name.trim() || !userForm.username.trim()) return addToast('الرجاء إدخال الاسم الكامل واسم الدخول', 'error');
                if(!editingUserId && !userForm.password.trim()) return addToast('الرجاء إدخال كلمة المرور للمستخدم الجديد', 'error');

                const duplicateUsername = db.users.some(u => u.username === userForm.username.trim() && u.id !== editingUserId);
                if(duplicateUsername) return addToast('اسم الدخول موجود مسبقاً، اختر اسم آخر', 'error');

                let nextUsers;
                if(editingUserId) {
                    nextUsers = db.users.map(u => u.id === editingUserId ? {
                        ...u,
                        name: userForm.name.trim(),
                        username: userForm.username.trim(),
                        password: userForm.password || u.password || '',
                        role: userForm.role,
                        phone: userForm.phone.trim(),
                        email: userForm.email.trim(),
                        status: userForm.status
                    } : u);
                    addToast('تم تعديل بيانات المستخدم بنجاح', 'success');
                } else {
                    const newUser = {
                        id: Date.now(),
                        name: userForm.name.trim(),
                        username: userForm.username.trim(),
                        password: userForm.password.trim(),
                        role: userForm.role,
                        phone: userForm.phone.trim(),
                        email: userForm.email.trim(),
                        status: userForm.status,
                        lastLogin: '-'
                    };
                    nextUsers = [newUser, ...db.users];
                    addToast('تم إضافة المستخدم فعلياً بنجاح', 'success');
                }

                updateDb('users', nextUsers);
                setShowModal(false);
                setEditingUserId(null);
                setUserForm(emptyUserForm);
            };

            const handleToggleStatus = (user) => {
                if(user.id === 1) return addToast('لا يمكن تعطيل مدير النظام الأساسي', 'error');
                const newStatus = user.status === 'نشط' ? 'معطل' : 'نشط';
                updateDb('users', db.users.map(u => u.id === user.id ? { ...u, status: newStatus } : u));
                addToast(`تم ${newStatus === 'نشط' ? 'تفعيل' : 'تعطيل'} المستخدم`, 'success');
            };

            const handleDelete = (id) => {
                if(id === 1) return addToast('لا يمكن حذف مدير النظام الأساسي', 'error');
                if(window.confirm('هل أنت متأكد من الحذف؟')){
                    updateDb('users', db.users.filter(u => u.id !== id));
                    addToast('تم الحذف بنجاح', 'success');
                }
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">إدارة المستخدمين والصلاحيات</h2>
                        <button onClick={openAddUser} className="bg-brand text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2 hover:bg-blue-700 shadow-md w-full sm:w-auto"><Icons.Plus /> مستخدم جديد</button>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white p-5 rounded-xl border shadow-sm"><p className="text-sm text-gray-500 mb-1">المستخدمين</p><p className="text-2xl font-bold">{db.users.length}</p></div>
                        <div className="bg-white p-5 rounded-xl border shadow-sm"><p className="text-sm text-gray-500 mb-1">النشطون</p><p className="text-2xl font-bold text-green-600">{db.users.filter(u=>u.status==='نشط').length}</p></div>
                        <div className="bg-white p-5 rounded-xl border shadow-sm"><p className="text-sm text-gray-500 mb-1">معطلة</p><p className="text-2xl font-bold text-red-600">{db.users.filter(u=>u.status==='معطل').length}</p></div>
                        <div className="bg-white p-5 rounded-xl border shadow-sm"><p className="text-sm text-gray-500 mb-1">الأدوار</p><p className="text-2xl font-bold text-blue-600">5</p></div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden mb-8">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-right crm-table">
                                <thead><tr><th>الاسم الكامل</th><th>اسم الدخول</th><th>الدور الوظيفي</th><th>الهاتف</th><th>البريد</th><th>آخر دخول</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
                                <tbody>
                                    {db.users.map(u => (
                                        <tr key={u.id}>
                                            <td className="font-bold text-gray-800">{u.name}</td><td dir="ltr" className="text-right text-gray-500">{u.username}</td>
                                            <td><span className="px-2 py-1 bg-gray-100 border rounded text-xs font-bold text-gray-700">{u.role}</span></td>
                                            <td dir="ltr" className="text-right font-medium">{u.phone || '-'}</td><td dir="ltr" className="text-right text-gray-500">{u.email || '-'}</td><td>{u.lastLogin || '-'}</td>
                                            <td><span className={`px-2 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${u.status === 'نشط' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{u.status}</span></td>
                                            <td>
                                                <div className="flex gap-3 text-xs font-bold">
                                                    <button onClick={() => openEditUser(u)} className="text-brand hover:underline">تعديل</button>
                                                    <button onClick={() => handleToggleStatus(u)} className={`${u.status === 'نشط' ? 'text-red-500' : 'text-green-600'} hover:underline`}>{u.status === 'نشط' ? 'تعطيل' : 'تفعيل'}</button>
                                                    {u.id !== 1 && <button onClick={() => handleDelete(u.id)} className="text-red-600 hover:text-red-800 bg-red-50 px-2 py-1 rounded border border-red-200"><Icons.Trash /></button>}
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                    {db.users.length === 0 && <tr><td colSpan="8" className="text-center p-8 text-gray-500 font-bold">لا توجد بيانات حالياً</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5 overflow-x-auto">
                        <h3 className="font-bold text-gray-800 mb-4">مصفوفة الصلاحيات العامة</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
                            {permissionsModules.map(m => <div key={m} className="flex items-center justify-between bg-gray-50 border rounded-lg p-3"><span className="font-bold text-gray-700">{m}</span><span className="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">عرض / إضافة / تعديل</span></div>)}
                        </div>
                    </div>

                    <Modal title={editingUserId ? 'تعديل حساب مستخدم' : 'إنشاء حساب مستخدم جديد'} isOpen={showModal} onClose={() => setShowModal(false)}>
                        <div className="space-y-5">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                <div><label className="block text-sm font-bold mb-1 text-gray-700">الاسم الكامل *</label><input type="text" className="w-full border p-3 rounded bg-gray-50" value={userForm.name} onChange={e=>setUserForm({...userForm, name:e.target.value})} placeholder="مثال: أحمد عبد الله" /></div>
                                <div><label className="block text-sm font-bold mb-1 text-gray-700">اسم الدخول (Username) *</label><input type="text" className="w-full border p-3 rounded bg-gray-50" dir="ltr" value={userForm.username} onChange={e=>setUserForm({...userForm, username:e.target.value})} placeholder="ahmed.a" /></div>
                                <div><label className="block text-sm font-bold mb-1 text-gray-700">كلمة المرور {editingUserId ? '(اتركها كما هي إذا لا تريد تغييرها)' : '*'}</label><input type="password" className="w-full border p-3 rounded bg-gray-50" value={userForm.password} onChange={e=>setUserForm({...userForm, password:e.target.value})} placeholder="********" /></div>
                                <div><label className="block text-sm font-bold mb-1 text-gray-700">الدور والصلاحية *</label><select className="w-full border p-3 rounded bg-gray-50" value={userForm.role} onChange={e=>setUserForm({...userForm, role:e.target.value})}><option>موظف الاستقبال</option><option>مدير النظام</option><option>موظف CRM</option><option>مشرف الصيانة</option><option>المحاسب</option></select></div>
                                <div><label className="block text-sm font-bold mb-1 text-gray-700">رقم الهاتف</label><input type="text" className="w-full border p-3 rounded bg-gray-50" dir="ltr" value={userForm.phone} onChange={e=>setUserForm({...userForm, phone:e.target.value})} placeholder="07900000000" /></div>
                                <div><label className="block text-sm font-bold mb-1 text-gray-700">البريد الإلكتروني</label><input type="email" className="w-full border p-3 rounded bg-gray-50" dir="ltr" value={userForm.email} onChange={e=>setUserForm({...userForm, email:e.target.value})} placeholder="user@email.com" /></div>
                                <div><label className="block text-sm font-bold mb-1 text-gray-700">الحالة</label><select className="w-full border p-3 rounded bg-gray-50" value={userForm.status} onChange={e=>setUserForm({...userForm, status:e.target.value})}><option>نشط</option><option>معطل</option></select></div>
                            </div>
                            <div className="flex justify-end gap-3 pt-5 border-t mt-5">
                                <button onClick={() => setShowModal(false)} className="px-6 py-2.5 bg-gray-200 text-gray-800 rounded font-bold hover:bg-gray-300">تجاهل</button>
                                <button onClick={handleSaveUser} className="px-6 py-2.5 bg-brand text-white rounded font-bold shadow-md hover:bg-blue-700 flex items-center gap-2"><Icons.Check /> حفظ الحساب</button>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        }
        
        // 11. Settings & Templates
        const Settings = ({ db, updateDb, addToast, syncStatus }) => {
            const [showTmplModal, setShowTmplModal] = useState(false);
            const [editTmpl, setEditTmpl] = useState({ title: '', text: '', useGreeting: true });
            const [cloudCfg, setCloudCfg] = useState(getSupabaseConfig());
            const handleSaveCloudConfig = async () => {
                saveSupabaseConfig(cloudCfg.url, cloudCfg.key);
                addToast('تم حفظ إعدادات Supabase. سيتم إعادة تحميل النظام لتفعيل الاتصال.', 'success');
                setTimeout(() => window.location.reload(), 900);
            };
            
            const handleSaveTemplate = () => {
                if(!editTmpl.title || !editTmpl.text) return addToast("أكمل الحقول", "error");
                updateDb('templates', [...db.templates, {id: Date.now(), ...editTmpl}]);
                setShowTmplModal(false);
                addToast("تم إضافة القالب بنجاح", "success");
                setEditTmpl({ title: '', text: '', useGreeting: true });
            };

            const handleDeleteTemplate = (id) => {
                if(window.confirm("هل تريد حذف هذا القالب؟")) {
                    updateDb('templates', db.templates.filter(t=>t.id !== id));
                    addToast("تم حذف القالب", "success");
                }
            };

            return (
                <div className="space-y-6 max-w-5xl pb-10 mx-auto lg:mx-0">
                    <h2 className="text-2xl font-bold text-gray-800 border-b pb-2">إعدادات النظام العامة</h2>
                    
                    <form onSubmit={(e) => {e.preventDefault(); addToast("ممتاز! تم حفظ كافة الإعدادات بنجاح.", "success");}} className="space-y-8">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-5">
                            <h3 className="font-bold text-brand text-lg">معلومات الورشة الأساسية (تظهر في الفواتير)</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div><label className="block text-sm font-bold mb-1 text-gray-700">اسم الورشة التجاري *</label><input type="text" required className="w-full border p-3 rounded bg-gray-50 focus:bg-white" defaultValue="هندسة السيارات" /></div>
                                <div><label className="block text-sm font-bold mb-1 text-gray-700">العملة الافتراضية (مقفلة)</label><input type="text" className="w-full border p-3 rounded bg-gray-200 text-gray-500 font-bold" defaultValue="دينار عراقي (د.ع)" disabled /></div>
                                <div><label className="block text-sm font-bold mb-1 text-gray-700">هاتف الورشة (للرسائل والواتساب) *</label><input type="text" required className="w-full border p-3 rounded bg-gray-50 focus:bg-white" defaultValue="07900000000" dir="ltr" /></div>
                                <div><label className="block text-sm font-bold mb-1 text-gray-700">رابط شعار الورشة (Logo)</label><input type="text" className="w-full border p-3 rounded bg-gray-50 focus:bg-white" placeholder="https://..." dir="ltr" /></div>
                            </div>
                            <div className="flex justify-end pt-2"><button type="submit" className="bg-brand text-white px-8 py-2.5 rounded-lg font-bold shadow-md hover:bg-blue-700">حفظ إعدادات الورشة</button></div>
                        </div>
                    </form>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-5">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 border-b pb-3">
                            <div>
                                <h3 className="font-bold text-brand text-lg">ربط قاعدة البيانات السحابية Supabase</h3>
                                <p className="text-sm text-gray-500 mt-1">بعد إدخال الرابط والمفتاح، ستتزامن البيانات بين الموبايل والحاسبة.</p>
                            </div>
                            <span className={`px-3 py-1 rounded-full text-xs font-black border ${syncStatus && syncStatus.includes('متصل') ? 'bg-green-50 text-green-700 border-green-200' : syncStatus && syncStatus.includes('فشل') ? 'bg-red-50 text-red-700 border-red-200' : 'bg-gray-50 text-gray-600 border-gray-200'}`}>{syncStatus || 'حفظ محلي فقط'}</span>
                        </div>
                        <div className="grid grid-cols-1 gap-4">
                            <div><label className="block text-sm font-bold mb-1 text-gray-700">Project URL</label><input type="text" dir="ltr" className="w-full border p-3 rounded bg-gray-50 focus:bg-white" value={cloudCfg.url} onChange={e=>setCloudCfg({...cloudCfg, url:e.target.value})} placeholder="https://xxxx.supabase.co" /></div>
                            <div><label className="block text-sm font-bold mb-1 text-gray-700">Anon / Publishable Key</label><input type="password" dir="ltr" className="w-full border p-3 rounded bg-gray-50 focus:bg-white" value={cloudCfg.key} onChange={e=>setCloudCfg({...cloudCfg, key:e.target.value})} placeholder="eyJhbGciOi..." /></div>
                        </div>
                        <div className="bg-blue-50 border border-blue-100 p-4 rounded-lg text-sm text-blue-800 leading-relaxed"><b>مهم:</b> قبل الحفظ، أنشئ جدول <span dir="ltr" className="font-mono bg-white px-1 rounded">crm_app_state</span> في Supabase باستخدام ملف SQL المرفق مع النسخة المعدلة. لا تستخدم مفتاح <span dir="ltr" className="font-mono bg-white px-1 rounded">service_role</span> هنا.</div>
                        <div className="flex justify-end"><button type="button" onClick={handleSaveCloudConfig} className="bg-navy-900 text-white px-8 py-2.5 rounded-lg font-bold shadow-md hover:bg-navy-800">حفظ وتفعيل المزامنة</button></div>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-5">
                        <div className="flex justify-between items-center border-b pb-3">
                            <h3 className="font-bold text-brand text-lg">إدارة قوالب الرسائل (WhatsApp & SMS)</h3>
                            <button onClick={()=>setShowTmplModal(true)} className="bg-green-600 text-white px-4 py-2 rounded font-bold shadow-md hover:bg-green-700 text-sm flex gap-2 items-center"><Icons.Plus /> قالب جديد</button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {db.templates.map(t => (
                                <div key={t.id} className="border-2 border-gray-200 p-4 rounded-lg bg-gray-50 relative">
                                    <h4 className="font-bold text-gray-800 mb-2">{t.title}</h4>
                                    <p className="text-sm text-gray-600 mb-4 leading-relaxed whitespace-pre-wrap">{t.text}</p>
                                    {t.useGreeting && <span className="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-bold">يحتوي على تحية آلية</span>}
                                    <div className="absolute left-4 top-4 flex gap-2">
                                        <button onClick={()=>handleDeleteTemplate(t.id)} className="text-red-500 hover:bg-red-100 p-1 rounded"><Icons.Trash /></button>
                                    </div>
                                </div>
                            ))}
                            {db.templates.length === 0 && <div className="col-span-2 text-center py-6 text-gray-500 font-bold">لا توجد قوالب حالياً</div>}
                        </div>
                    </div>

                    <Modal title="إضافة قالب رسالة جديد" isOpen={showTmplModal} onClose={() => setShowTmplModal(false)}>
                        <div className="space-y-4">
                            <div><label className="block text-sm font-bold mb-1">اسم القالب (لتمييزه)</label><input type="text" className="w-full border p-3 rounded bg-gray-50" value={editTmpl.title} onChange={e=>setEditTmpl({...editTmpl, title: e.target.value})} placeholder="مثال: رسالة ترحيبية..." /></div>
                            <div>
                                <label className="block text-sm font-bold mb-2">المتغيرات المدعومة (تُستبدل آلياً):</label>
                                <div className="text-xs text-gray-600 bg-blue-50 border border-blue-100 p-3 rounded mb-3 font-bold">
                                    [اسم العميل] - [نوع السيارة] - [آخر زيارة]
                                </div>
                                <label className="block text-sm font-bold mb-1">نص الرسالة</label>
                                <textarea className="w-full border p-3 rounded h-32 bg-gray-50" value={editTmpl.text} onChange={e=>setEditTmpl({...editTmpl, text: e.target.value})} placeholder="اكتب النص هنا..."></textarea>
                            </div>
                            <div>
                                <label className="flex items-center gap-2 cursor-pointer text-sm font-bold bg-gray-50 p-3 border rounded">
                                    <input type="checkbox" checked={editTmpl.useGreeting} onChange={e=>setEditTmpl({...editTmpl, useGreeting: e.target.checked})} className="text-brand w-5 h-5 rounded"/> 
                                    إضافة تحية (مرحبا [اسم العميل]،) آلياً في البداية
                                </label>
                            </div>
                            <div className="flex justify-end gap-3 pt-4 border-t"><button onClick={() => setShowTmplModal(false)} className="px-5 py-2 bg-gray-200 rounded font-bold">إلغاء</button><button onClick={handleSaveTemplate} className="px-5 py-2 bg-brand text-white rounded font-bold shadow-md hover:bg-blue-700">حفظ القالب</button></div>
                        </div>
                    </Modal>
                </div>
            );
        };

        // --- Main App Component (With Login) ---
        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);

            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedCustomer, setSelectedCustomer] = useState(null);
            const [toast, setToast] = useState(null);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [db, setDb] = useState(() => getStoredDb());
            const [syncStatus, setSyncStatus] = useState(getSupabaseConfig().url ? 'جاري الاتصال...' : 'حفظ محلي فقط');

            useEffect(() => {
                let channel = null; let active = true;
                const initCloud = async () => {
                    try {
                        const cfg = getSupabaseConfig();
                        if (!cfg.url || !cfg.key) { setSyncStatus('حفظ محلي فقط'); return; }
                        setSyncStatus('جاري الاتصال بقاعدة البيانات...');
                        const cloudDb = await cloudLoadDb();
                        if (cloudDb && active) { setDb(cloudDb); saveLocalDb(cloudDb); setSyncStatus('متصل ومزامن'); }
                        else { await cloudSaveDb(getStoredDb()); setSyncStatus('تم إنشاء نسخة سحابية أولية'); }
                        channel = subscribeToCloud((nextDb) => { if(active) setDb(nextDb); }, setSyncStatus);
                    } catch (err) { console.error(err); setSyncStatus('فشل الاتصال - يعمل محلياً'); }
                };
                initCloud();
                return () => { active = false; try { if(channel) getSupabaseClient()?.removeChannel(channel); } catch(e) {} };
            }, []);

            const handleLogin = (user) => { setCurrentUser(user); setIsAuthenticated(true); };
            const handleLogout = () => { setIsAuthenticated(false); setCurrentUser(null); };

            const showToast = (message, type) => setToast({ message, type, id: Date.now() });
            const updateDb = (collection, newData) => setDb(prev => { const next = { ...prev, [collection]: newData }; queueCloudSave(next, setSyncStatus); return next; });
            const handleViewProfile = (customer) => { setSelectedCustomer(customer); setActiveTab('customers'); };

            if (!isAuthenticated) return <LoginScreen onLogin={handleLogin} users={db.users} />;

            const tabs = [
                { id: 'dashboard', name: 'لوحة التحكم', icon: <Icons.Dashboard /> },
                { id: 'customers', name: 'إدارة العملاء', icon: <Icons.Users /> },
                { id: 'workorder', name: 'إدخال ورقة عمل (فاتورة)', icon: <Icons.Wrench /> },
                { id: 'history', name: 'سجل الزيارات والخدمات', icon: <Icons.History /> },
                { id: 'followups', name: 'إدارة المتابعات', icon: <Icons.Clock /> },
                { id: 'communication', name: 'أتمتة مهام التواصل', icon: <Icons.Message /> },
                { id: 'feedback', name: 'التقييمات والفيدباك', icon: <Icons.Star /> },
                { id: 'offers', name: 'العروض التسويقية', icon: <Icons.Gift /> },
                { id: 'reports', name: 'تقارير الإدارة', icon: <Icons.Report /> },
                { id: 'users', name: 'المستخدمون والصلاحيات', icon: <Icons.Users /> },
                { id: 'settings', name: 'إعدادات النظام', icon: <Icons.Settings /> },
            ];

            const renderContent = () => {
                if (activeTab === 'customers' && selectedCustomer) return <CustomerProfile customer={selectedCustomer} onBack={() => setSelectedCustomer(null)} db={db} addToast={showToast} />;
                switch(activeTab) {
                    case 'dashboard': return <Dashboard db={db} />;
                    case 'customers': return <Customers db={db} updateDb={updateDb} onViewProfile={handleViewProfile} addToast={showToast} />;
                    case 'workorder': return <WorkOrder db={db} updateDb={updateDb} addToast={showToast} />;
                    case 'history': return <History db={db} updateDb={updateDb} onViewProfile={handleViewProfile} addToast={showToast} />;
                    case 'followups': return <FollowUps db={db} updateDb={updateDb} onViewProfile={handleViewProfile} addToast={showToast} />;
                    case 'communication': return <Communication db={db} updateDb={updateDb} addToast={showToast} />;
                    case 'feedback': return <Feedback db={db} updateDb={updateDb} addToast={showToast} />;
                    case 'offers': return <Offers db={db} updateDb={updateDb} addToast={showToast} />;
                    case 'reports': return <Reports db={db} addToast={showToast} />;
                    case 'users': return <Users db={db} updateDb={updateDb} addToast={showToast} />;
                    case 'settings': return <Settings db={db} updateDb={updateDb} addToast={showToast} syncStatus={syncStatus} />;
                    default: return <Dashboard db={db} />;
                }
            };

            return (
                <div className="flex h-screen overflow-hidden bg-[#f8fafc]">
                    {toast && <Toast key={toast.id} message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    
                    {isSidebarOpen && <div className="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden print-hide" onClick={() => setIsSidebarOpen(false)}></div>}

                    <aside className={`fixed inset-y-0 right-0 z-50 transform transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0 w-72 bg-navy-900 text-white flex flex-col shadow-2xl flex-shrink-0 print-hide ${isSidebarOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="p-6 border-b border-navy-800 text-center flex justify-between items-center lg:block">
                            <div>
                                <h1 className="text-2xl font-black tracking-wider text-white">هندسة السيارات</h1>
                                <p className="text-blue-400 text-xs mt-1 font-medium tracking-widest uppercase">CRM System</p>
                            </div>
                            <button onClick={()=>setIsSidebarOpen(false)} className="lg:hidden text-gray-400 hover:text-white"><Icons.X /></button>
                        </div>
                        <nav className="flex-1 overflow-y-auto sidebar-scroll py-4 px-3 space-y-1.5">
                            {tabs.map(tab => (
                                <button key={tab.id} onClick={() => { setActiveTab(tab.id); setSelectedCustomer(null); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all duration-200 text-sm font-bold border border-transparent ${activeTab === tab.id ? 'bg-brand text-white shadow-lg border-blue-400/30' : 'text-gray-300 hover:bg-navy-800 hover:text-white'}`}>
                                    {tab.icon}{tab.name}
                                    {tab.id === 'communication' && db.communicationQueue.filter(q=>q.status==='قيد الانتظار').length > 0 && <span className="mr-auto bg-red-500 text-white px-2 py-0.5 rounded-full text-xs shadow-sm">{db.communicationQueue.filter(q=>q.status==='قيد الانتظار').length}</span>}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-navy-800 flex justify-between items-center">
                            <span className="text-xs text-gray-400 font-bold">{currentUser?.username} ({currentUser?.role})</span>
                            <button onClick={handleLogout} className="text-red-400 hover:text-red-300" title="تسجيل الخروج"><Icons.LogOut /></button>
                        </div>
                    </aside>
                    
                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative min-w-0 w-full">
                        <header className="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-4 lg:px-8 flex-shrink-0 z-10 shadow-sm print-hide">
                            <div className="flex items-center gap-3">
                                <button onClick={()=>setIsSidebarOpen(true)} className="lg:hidden text-gray-700 hover:text-brand"><Icons.Menu /></button>
                                <div className="text-lg font-bold text-gray-800 truncate max-w-[200px] sm:max-w-md">
                                    {tabs.find(t => t.id === activeTab)?.name} 
                                    {activeTab === 'customers' && selectedCustomer && <span className="text-gray-400 font-normal truncate hidden sm:inline"> / ملف {selectedCustomer.name}</span>}
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-[11px] font-black text-gray-500 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-200 hidden md:block shadow-inner">{syncStatus}</div>
                                <div className="text-sm font-bold text-gray-500 bg-gray-50 px-4 py-1.5 rounded-full border border-gray-200 hidden sm:block shadow-inner">{new Date().toLocaleDateString('ar-IQ')}</div>
                                <div className="w-10 h-10 bg-gradient-to-tr from-brand to-blue-400 text-white rounded-full flex items-center justify-center font-black shadow-md border-2 border-white">{currentUser?.username.charAt(0).toUpperCase()}</div>
                            </div>
                        </header>
                        <div className="flex-1 overflow-y-auto main-scroll p-4 sm:p-8 bg-[#f8fafc] print:p-0 print:bg-white print:overflow-visible">
                            {renderContent()}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
