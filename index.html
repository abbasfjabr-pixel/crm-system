<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هندسة السيارات - نظام إدارة الورشة (CRM)</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            800: '#1e3a8a',
                            900: '#0f172a',
                        },
                        brand: '#2563eb',
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Supabase JS (Cloud Database) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #1e293b; overflow-x: hidden; }
        .sidebar-scroll::-webkit-scrollbar { width: 6px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .main-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .main-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .main-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* Custom Input Styles */
        input, select, textarea { transition: all 0.2s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        /* Table Styles */
        .crm-table th { background-color: #f8fafc; color: #475569; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em; padding: 12px 16px; text-align: right; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
        .crm-table td { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; white-space: nowrap;}
        .crm-table tr:hover { background-color: #f1f5f9; }

        /* Animation */
        @keyframes slideIn { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Print Styles */
        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { position: absolute; left: 0; top: 0; width: 100%; direction: rtl; background: white; padding: 10mm; box-shadow: none; border: none; margin: 0; color: #000; }
            .print-hide { display: none !important; }
            .print-break-inside-avoid { break-inside: avoid; }
            @page { size: A4; margin: 5mm; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Utility Functions ---
        const formatMoney = (amount) => new Intl.NumberFormat('ar-IQ').format(amount || 0) + ' د.ع';
        const formatDate = (dateString) => {
            if(!dateString) return '-';
            return new Date(dateString).toLocaleDateString('ar-IQ', { year: 'numeric', month: 'short', day: 'numeric' });
        };
        const generateWhatsAppLink = (phone, msg = "") => {
            if (!phone) return '#';
            let cleanPhone = phone.replace(/\D/g, '');
            if (cleanPhone.startsWith('0')) cleanPhone = '964' + cleanPhone.substring(1);
            return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`;
        };
        const exportToExcelCSV = (filename, headers, rows) => {
            // Excel-compatible HTML export. Works from GitHub Pages without a backend.
            const safe = (v) => String(v !== undefined && v !== null ? v : '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const table = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="UTF-8"><style>table{direction:rtl;border-collapse:collapse;font-family:Arial}td,th{border:1px solid #999;padding:8px;text-align:right}th{background:#f1f5f9}</style></head>
                <body><table><thead><tr>${headers.map(h=>`<th>${safe(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${safe(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></body></html>`;
            const blob = new Blob([table], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = filename.endsWith('.xls') || filename.endsWith('.xlsx') ? filename.replace('.xlsx','.xls') : `${filename}.xls`;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        };

        // --- Gemini API Function ---
        const generateWithGemini = async (prompt, systemInstruction = "") => {
            const apiKey = "";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const maxRetries = 5;
            const delays = [1000, 2000, 4000, 8000, 16000];

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemInstruction }] } })
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                } catch (error) {
                    if (i === maxRetries - 1) return "عذراً، تعذر الاتصال بالذكاء الاصطناعي حالياً. يرجى المحاولة لاحقاً.";
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        };

        // --- Icons ---
        const Icons = {
            Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>,
            Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
            Wrench: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            History: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
            Clock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
            Message: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>,
            Star: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>,
            Gift: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path></svg>,
            Report: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>,
            Search: () => <svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
            Check: () => <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>,
            X: () => <svg className="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
            Back: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>,
            Phone: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>,
            Car: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>,
            Download: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>,
            FileText: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
            Menu: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>,
            LogOut: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>,
        };

        // --- Reusable UI Components ---
        const Modal = ({ title, isOpen, onClose, children, size = "max-w-2xl", customHeader = null }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-navy-900 bg-opacity-50 flex items-center justify-center z-[60] animate-fade-in p-4 print:p-0 print:bg-white print:static print:inset-auto">
                    <div className={`bg-white rounded-xl shadow-2xl w-full ${size} max-h-[90vh] flex flex-col animate-slide-in print-container print:max-h-none print:shadow-none print:w-full`}>
                        {customHeader ? customHeader : (
                            <div className="p-5 border-b flex justify-between items-center bg-gray-50 rounded-t-xl print-hide">
                                <h3 className="font-bold text-lg text-gray-800">{title}</h3>
                                <button onClick={onClose} className="text-gray-400 hover:text-red-500 transition-colors"><Icons.X /></button>
                            </div>
                        )}
                        <div className="p-6 overflow-y-auto main-scroll print:overflow-visible print:p-0" id="printable-area">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            const colors = type === 'success' ? 'bg-green-100 border-green-500 text-green-800' : 'bg-red-100 border-red-500 text-red-800';
            const icon = type === 'success' ? <Icons.Check /> : <Icons.X />;
            return (
                <div className={`fixed bottom-6 left-6 z-[70] flex items-center gap-3 px-6 py-4 rounded-lg border-l-4 shadow-lg animate-slide-in ${colors}`}>
                    {icon}<span className="font-bold text-sm">{message}</span>
                </div>
            );
        };

        // --- Login Screen ---
        const LoginScreen = ({ onLogin, users = [] }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!username || !password) return setError("الرجاء إدخال اسم المستخدم وكلمة المرور");
                const found = (users || []).find(u => u.username === username && (u.password === password || (!u.password && username === "admin")));
                if(!found) return setError("اسم المستخدم أو كلمة المرور غير صحيحة");
                if(found.status === "معطل") return setError("هذا الحساب معطل، راجع مدير النظام");
                onLogin({ username: found.username, name: found.name, role: found.role });
            };

            return (
                <div className="flex h-screen w-full bg-navy-900 items-center justify-center p-4 relative overflow-hidden">
                    <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-brand rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
                    
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full relative z-10 animate-slide-in">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-black text-gray-900 tracking-wide mb-2">هندسة السيارات</h1>
                            <p className="text-gray-500 font-bold">نظام إدارة الورشة (CRM)</p>
                        </div>
                        {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm font-bold mb-4 border border-red-200 text-center">{error}</div>}
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">اسم المستخدم</label>
                                <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full border-2 border-gray-200 p-3 rounded-xl focus:border-brand focus:ring-0 text-left" dir="ltr" placeholder="admin" />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">كلمة المرور</label>
                                <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full border-2 border-gray-200 p-3 rounded-xl focus:border-brand focus:ring-0 text-left" dir="ltr" placeholder="••••••••" />
                            </div>
                            <button type="submit" className="w-full bg-brand text-white py-3.5 rounded-xl font-bold text-lg hover:bg-blue-700 transition-colors shadow-lg mt-4">تسجيل الدخول</button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- Global Database State (CLEAN START MODE) ---
        const initialDB = {
            customers: [],
            workOrders: [],
            followUps: [],
            feedback: [],
            offers: [],
            communicationQueue: [],
            users: [
                { id: 1, name: 'مدير النظام', username: 'admin', role: 'مدير النظام', phone: '07900000000', email: 'admin@workshop.com', status: 'نشط', lastLogin: '-' }
            ],
            templates: []
        };

        // --- Cloud Sync Layer (Supabase) ---
        const LOCAL_DB_KEY = 'automotive_crm_local_db_v2';
        const SUPABASE_CONFIG_KEY = 'automotive_crm_supabase_config_v1';
        let cloudSaveTimer = null;
        const safeJsonParse = (text, fallback) => { try { return JSON.parse(text); } catch(e) { return fallback; } };
        const getStoredDb = () => { const stored = localStorage.getItem(LOCAL_DB_KEY); const parsed = stored ? safeJsonParse(stored, initialDB) : initialDB; return { ...initialDB, ...parsed }; };
        const saveLocalDb = (data) => localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(data));
        const getSupabaseConfig = () => { const cfg = safeJsonParse(localStorage.getItem(SUPABASE_CONFIG_KEY) || '{}', {}); return { url: cfg.url || '', key: cfg.key || '' }; };
        const saveSupabaseConfig = (url, key) => { localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify({ url: (url||'').trim(), key: (key||'').trim() })); };
        const getSupabaseClient = () => { const cfg = getSupabaseConfig(); if (!cfg.url || !cfg.key || !window.supabase) return null; return window.supabase.createClient(cfg.url, cfg.key); };
        const cloudLoadDb = async () => { const client = getSupabaseClient(); if (!client) return null; const { data, error } = await client.from('crm_app_state').select('data').eq('id', 1).maybeSingle(); if (error) throw error; return data?.data ? { ...initialDB, ...data.data } : null; };
        const cloudSaveDb = async (db) => { const client = getSupabaseClient(); if (!client) return false; const cleanData = JSON.parse(JSON.stringify({ ...initialDB, ...db })); const { error } = await client.from('crm_app_state').upsert({ id: 1, data: cleanData, updated_at: new Date().toISOString() }); if (error) throw error; return true; };
        const queueCloudSave = (db, setSyncStatus) => { saveLocalDb(db); if (!getSupabaseConfig().url || !getSupabaseConfig().key) { setSyncStatus && setSyncStatus('حفظ محلي فقط'); return; } clearTimeout(cloudSaveTimer); setSyncStatus && setSyncStatus('جاري المزامنة...'); cloudSaveTimer = setTimeout(async () => { try { await cloudSaveDb(db); setSyncStatus && setSyncStatus('متصل ومزامن'); } catch (err) { console.error('Supabase save error:', err); setSyncStatus && setSyncStatus('فشل المزامنة - تحقق من Supabase'); } }, 600); };
        const subscribeToCloud = (onChange, setSyncStatus) => { const client = getSupabaseClient(); if (!client) return null; const channel = client.channel('crm_app_state_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'crm_app_state', filter: 'id=eq.1' }, (payload) => { if (payload.new?.data) { const next = { ...initialDB, ...payload.new.data }; saveLocalDb(next); onChange(next); setSyncStatus && setSyncStatus('تم تحديث البيانات من السحابة'); } }).subscribe(); return channel; };

        // --- Components ---

        // 1. Dashboard
        const Dashboard = ({ db }) => {
            useEffect(() => {
                const ctxRev = document.getElementById('revenueChart');
                if(ctxRev && !ctxRev.dataset.chartjs) {
                    ctxRev.dataset.chartjs = "true";
                    new Chart(ctxRev, {
                        type: 'line',
                        data: {
                            labels: ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'],
                            datasets: [{ label: 'الإيرادات (د.ع)', data: [0, 0, 0, 0, 0, 0], borderColor: '#2563eb', backgroundColor: 'rgba(37, 99, 235, 0.1)', fill: true, tension: 0.4 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
                    });
                }
            }, []);

            return (
                <div className="space-y-6 animate-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">نظرة عامة على الورشة</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                        {[
                            { title: 'إجمالي العملاء', value: db.customers.length, color: 'bg-blue-50 text-blue-700' },
                            { title: 'إجمالي الإيرادات (الشهر)', value: formatMoney(db.workOrders.reduce((sum, wo) => sum + wo.total, 0)), color: 'bg-green-50 text-green-700' },
                            { title: 'الخدمات المنفذة', value: db.workOrders.length, color: 'bg-purple-50 text-purple-700' },
                            { title: 'مهام التواصل اليوم', value: db.communicationQueue.filter(q => q.status === 'قيد الانتظار').length, color: 'bg-yellow-50 text-yellow-700' },
                            { title: 'تذكيرات الزيت المطلوبة', value: db.communicationQueue.filter(q => q.type.includes('زيت') && q.status === 'قيد الانتظار').length, color: 'bg-red-50 text-red-700' },
                        ].map((kpi, i) => (
                            <div key={i} className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-center">
                                <p className="text-sm text-gray-500 font-medium mb-1">{kpi.title}</p>
                                <p className={`text-xl font-bold ${kpi.color.split(' ')[1]}`}>{kpi.value}</p>
                            </div>
                        ))}
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 lg:col-span-2">
                            <h3 className="text-lg font-bold text-gray-800 mb-4">الإيرادات الأسبوعية</h3>
                            <div className="h-64 w-full"><canvas id="revenueChart"></canvas></div>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Customers
        const Customers = ({ db, updateDb, onViewProfile, addToast }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [showAddModal, setShowAddModal] = useState(false);
            const [newCust, setNewCust] = useState({ name: '', phone: '', vehicleType: '', vehicleModel: '', plateNumber: '', engineSize: '', mileage: '', notes: '' });

            const handleAddCustomer = () => {
                if (!newCust.name || !newCust.phone) return addToast("الرجاء إدخال اسم العميل ورقم الهاتف", "error");
                const cust = {
                    id: `C-${Math.floor(1000 + Math.random() * 9000)}`,
                    ...newCust,
                    segment: 'عميل جديد', 
                    status: 'نشط',
                    lastVisit: '-',
                    totalSpent: 0,
                    visitsCount: 0,
                    averageRating: 0
                };
                updateDb('customers', [cust, ...db.customers]);
                addToast("تم إضافة العميل بنجاح وتم تصنيفه كعميل جديد.", "success");
                setShowAddModal(false);
                setNewCust({ name: '', phone: '', vehicleType: '', vehicleModel: '', plateNumber: '', engineSize: '', mileage: '', notes: '' });
            };

            const handleDelete = (id) => {
                if(window.confirm('هل أنت متأكد من الحذف؟ سيتم مسح بيانات العميل بشكل نهائي.')){
                    updateDb('customers', db.customers.filter(c => c.id !== id));
                    addToast('تم حذف العميل بنجاح', 'success');
                }
            };

            const filteredCustomers = db.customers.filter(c => c.name.includes(searchTerm) || c.phone.includes(searchTerm));

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">إدارة العملاء</h2>
                        <button onClick={() => setShowAddModal(true)} className="bg-brand text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 hover:bg-blue-700 w-full sm:w-auto justify-center shadow-md">
                            <Icons.Plus /> إضافة عميل جديد
                        </button>
                    </div>
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex gap-4">
                        <div className="flex-1 relative">
                            <Icons.Search className="absolute right-3 top-3" />
                            <input type="text" placeholder="بحث بالاسم، رقم الهاتف..." className="w-full pl-4 pr-10 py-2 border rounded-lg bg-gray-50" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                        </div>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm text-right crm-table">
                                <thead><tr><th>رقم العميل</th><th>الاسم</th><th>الهاتف</th><th>السيارة</th><th>التصنيف</th><th>إجمالي المدفوعات</th><th>الإجراءات</th></tr></thead>
                                <tbody>
                                    {filteredCustomers.map(c => (
                                        <tr key={c.id}>
                                            <td className="font-medium text-gray-500">{c.id}</td>
                                            <td className="font-bold text-gray-800">{c.name}</td>
                                            <td dir="ltr" className="text-right">{c.phone}</td>
                                            <td>{c.vehicleType} - {c.vehicleModel}</td>
                                            <td><span className={`px-2 py-1 rounded-md text-xs font-medium ${c.segment === 'عميل جديد' ? 'bg-green-100 text-green-700' : c.segment === 'VIP' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>{c.segment}</span></td>
                                            <td className="font-medium text-green-600">{formatMoney(c.totalSpent)}</td>
                                            <td>
                                                <div className="flex gap-2">
                                                    <button onClick={() => onViewProfile(c)} className="text-brand hover:text-blue-800 font-bold text-xs bg-blue-50 border border-blue-200 px-3 py-1.5 rounded">عرض الملف</button>
                                                    <button onClick={() => handleDelete(c.id)} className="text-red-600 hover:text-red-800 font-bold text-xs bg-red-50 border border-red-200 px-2 py-1.5 rounded" title="حذف العميل"><Icons.Trash /></button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                    {filteredCustomers.length === 0 && <tr><td colSpan="7" className="text-center py-8 text-gray-500 font-bold text-lg">لا توجد بيانات حالياً</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <Modal title="إضافة عميل جديد" isOpen={showAddModal} onClose={() => setShowAddModal(false)}>
                        <div className="space-y-4">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div><label className="block text-sm font-bold mb-1">اسم العميل *</label><input type="text" className="w-full border p-2 rounded bg-gray-50" value={newCust.name} onChange={e=>setNewCust({...newCust, name: e.target.value})} /></div>
                                <div><label className="block text-sm font-bold mb-1">رقم الهاتف *</label><input type="text" className="w-full border p-2 rounded bg-gray-50" dir="ltr" value={newCust.phone} onChange={e=>setNewCust({...newCust, phone: e.target.value})} /></div>
                                <div><label className="block text-sm font-bold mb-1">نوع السيارة (الماركة)</label><input type="text" className="w-full border p-2 rounded bg-gray-50" value={newCust.vehicleType} onChange={e=>setNewCust({...newCust, vehicleType: e.target.value})} /></div>
                                <div><label className="block text-sm font-bold mb-1">الموديل وسنة الصنع</label><input type="text" className="w-full border p-2 rounded bg-gray-50" value={newCust.vehicleModel} onChange={e=>setNewCust({...newCust, vehicleModel: e.target.value})} /></div>
                                <div><label className="block text-sm font-bold mb-1">رقم اللوحة</label><input type="text" className="w-full border p-2 rounded bg-gray-50" value={newCust.plateNumber} onChange={e=>setNewCust({...newCust, plateNumber: e.target.value})} /></div>
                                <div><label className="block text-sm font-bold mb-1">حجم المحرك</label><input type="text" className="w-full border p-2 rounded bg-gray-50" value={newCust.engineSize} onChange={e=>setNewCust({...newCust, engineSize: e.target.value})} /></div>
                                <div><label className="block text-sm font-bold mb-1">عداد الكيلومترات</label><input type="number" className="w-full border p-2 rounded bg-gray-50" value={newCust.mileage} onChange={e=>setNewCust({...newCust, mileage: e.target.value})} /></div>
                                <div className="sm:col-span-2"><label className="block text-sm font-bold mb-1">ملاحظات إضافية</label><textarea className="w-full border p-2 rounded bg-gray-50 h-20" value={newCust.notes} onChange={e=>setNewCust({...newCust, notes: e.target.value})}></textarea></div>
                            </div>
                            <div className="flex justify-end gap-3 pt-4 border-t mt-4">
                                <button onClick={() => setShowAddModal(false)} className="px-5 py-2 bg-gray-200 rounded font-bold hover:bg-gray-300">إلغاء</button>
                                <button onClick={handleAddCustomer} className="px-5 py-2 bg-brand text-white rounded font-bold hover:bg-blue-700 shadow-md flex items-center gap-2"><Icons.Check/> حفظ وتصنيف العميل</button>
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        };

        const CustomerProfile = ({ customer, onBack, db, addToast }) => {
            const [showPrintModal, setShowPrintModal] = useState(false);
            if (!customer) return null;

            const custOrders = db.workOrders.filter(w => w.customerName === customer.name);
            const detailedServicesList = custOrders.flatMap(wo => (wo.detailedServices || []).map(s => ({ ...s, date: wo.date, orderId: wo.id })));
            const commHistory = [
                ...db.feedback.filter(f => f.customer === customer.name).map(f => ({ date: f.date, type: 'تقييم الخدمة', result: f.status, rating: f.rating, comment: f.comment })),
                ...db.followUps.filter(f => f.customer === customer.name && f.status === 'مكتملة').map(f => ({ date: f.date, type: f.type, result: f.status, rating: '-', comment: f.notes }))
            ];
            const offersHistory = db.offers.filter(o => o.status === 'نشط'); // Mocked generic offers

            const handleExportExcel = () => {
                const headers = ["التاريخ", "رقم الطلب", "اسم الخدمة", "التفاصيل", "الكمية", "السعر", "الإجمالي"];
                const rows = detailedServicesList.map(s => [
                    s.date, s.orderId, s.name, Object.values(s.details||{}).join(' '), s.qty, s.price, parseFloat(s.price)*parseFloat(s.qty)
                ]);
                exportToExcelCSV(`تقرير_عميل_${customer.name.replace(/ /g,'_')}.csv`, headers, rows);
                addToast("تم تصدير التقرير المفصل إلى Excel بنجاح", "success");
            };

            const openWhatsApp = () => {
                window.open(generateWhatsAppLink(customer.phone, "", customer.name), '_blank');
                addToast("تم التوجيه إلى WhatsApp", "success");
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4">
                        <button onClick={onBack} className="flex items-center gap-2 text-gray-500 hover:text-brand font-bold bg-white px-4 py-2 rounded-lg border shadow-sm"><Icons.Back /> العودة للقائمة</button>
                        <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                            <button onClick={()=>setShowPrintModal(true)} className="flex-1 sm:flex-none bg-blue-100 text-brand px-4 py-2 rounded-lg font-bold border border-blue-200 hover:bg-blue-200 flex items-center justify-center gap-2"><Icons.FileText /> معاينة وطباعة</button>
                            <button onClick={handleExportExcel} className="flex-1 sm:flex-none bg-green-50 text-green-700 px-4 py-2 rounded-lg font-bold border border-green-200 hover:bg-green-100 flex items-center justify-center gap-2"><Icons.Download /> تصدير Excel</button>
                            <button onClick={openWhatsApp} className="flex-1 sm:flex-none bg-green-500 text-white px-4 py-2 rounded-lg font-bold shadow-md hover:bg-green-600 flex items-center justify-center gap-2"><Icons.Message /> واتساب</button>
                        </div>
                    </div>
                    
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 relative overflow-hidden">
                        <div className="absolute left-0 top-0 w-2 h-full bg-brand"></div>
                        <div>
                            <h2 className="text-3xl font-black text-gray-900 mb-3">{customer.name}</h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-x-8 gap-y-2 text-sm text-gray-700 font-medium">
                                <span className="flex items-center gap-2"><Icons.Phone /> <span dir="ltr">{customer.phone}</span></span>
                                <span className="flex items-center gap-2"><Icons.Car /> {customer.vehicleType} {customer.vehicleModel}</span>
                                <span>اللوحة: {customer.plateNumber || '-'}</span>
                                <span>العداد: {customer.mileage ? customer.mileage + ' كم' : '-'}</span>
                            </div>
                        </div>
                        <div className="bg-gray-50 p-4 rounded-lg border text-center min-w-[200px] w-full md:w-auto">
                            <span className={`inline-block px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider mb-3 ${customer.segment === 'عميل جديد' ? 'bg-green-100 text-green-700' : customer.segment === 'VIP' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>{customer.segment}</span>
                            <div className="flex justify-between items-center text-sm border-t pt-2"><span className="text-gray-500">إجمالي الصرف:</span><span className="font-black text-green-600">{formatMoney(customer.totalSpent)}</span></div>
                            <div className="flex justify-between items-center text-sm"><span className="text-gray-500">الزيارات:</span><span className="font-bold">{customer.visitsCount}</span></div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Visits Table */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <div className="p-4 bg-gray-50 border-b font-bold text-gray-800">أ. جدول الزيارات وفواتير العمل</div>
                            <div className="overflow-x-auto max-h-80 main-scroll">
                                <table className="w-full text-sm text-right crm-table">
                                    <thead className="sticky top-0 bg-gray-50"><tr><th>رقم الطلب</th><th>التاريخ</th><th>الخدمات</th><th>المبلغ</th><th>الفني</th></tr></thead>
                                    <tbody>
                                        {custOrders.map(wo => <tr key={wo.id}><td className="text-brand font-bold">{wo.id}</td><td>{wo.date}</td><td className="truncate max-w-[120px]" title={wo.services.join('، ')}>{wo.services.join('، ')}</td><td className="font-bold text-green-600">{formatMoney(wo.total)}</td><td>{wo.technician}</td></tr>)}
                                        {custOrders.length === 0 && <tr><td colSpan="5" className="text-center py-8 text-gray-500 font-bold text-lg">لا توجد بيانات حالياً</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Detailed Services Table */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <div className="p-4 bg-gray-50 border-b font-bold text-gray-800">ب. جدول الخدمات التفصيلية والقطع</div>
                            <div className="overflow-x-auto max-h-80 main-scroll">
                                <table className="w-full text-sm text-right crm-table">
                                    <thead className="sticky top-0 bg-gray-50"><tr><th>الخدمة</th><th>التفاصيل</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead>
                                    <tbody>
                                        {detailedServicesList.map((s,i) => {
                                            const detailsStr = Object.values(s.details||{}).filter(v=>v).join(' - ');
                                            const total = (parseFloat(s.price)||0) * (parseFloat(s.qty)||1);
                                            return <tr key={i}><td className="font-bold">{s.name}</td><td className="text-gray-500 text-xs">{detailsStr||'-'}</td><td className="text-center">{s.qty||1}</td><td>{formatMoney(s.price)}</td><td className="font-bold text-gray-900">{formatMoney(total)}</td></tr>
                                        })}
                                        {detailedServicesList.length === 0 && <tr><td colSpan="5" className="text-center py-8 text-gray-500 font-bold text-lg">لا توجد بيانات حالياً</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Communication History */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <div className="p-4 bg-gray-50 border-b font-bold text-gray-800">ج. سجل التواصل والفيدباك</div>
                            <div className="overflow-x-auto max-h-64 main-scroll">
                                <table className="w-full text-sm text-right crm-table">
                                    <thead className="sticky top-0 bg-gray-50"><tr><th>التاريخ</th><th>النوع</th><th>النتيجة</th><th>التقييم</th><th>الرأي / الملاحظة</th></tr></thead>
                                    <tbody>
                                        {commHistory.map((c,i) => <tr key={i}><td>{c.date}</td><td><span className="bg-gray-200 px-2 py-1 rounded text-xs">{c.type}</span></td><td>{c.result}</td><td className="text-yellow-500 font-bold">{c.rating !== '-' ? c.rating+'★' : '-'}</td><td className="truncate max-w-[150px]">{c.comment||'-'}</td></tr>)}
                                        {commHistory.length === 0 && <tr><td colSpan="5" className="text-center py-8 text-gray-500 font-bold text-lg">لا توجد بيانات حالياً</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Offers History */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <div className="p-4 bg-gray-50 border-b font-bold text-gray-800">د. سجل العروض المرسلة</div>
                            <div className="overflow-x-auto max-h-64 main-scroll">
                                <table className="w-full text-sm text-right crm-table">
                                    <thead className="sticky top-0 bg-gray-50"><tr><th>اسم العرض</th><th>تاريخ الإرسال</th><th>الاستجابة</th></tr></thead>
                                    <tbody>
                                        {offersHistory.map((o,i) => <tr key={i}><td className="font-bold">{o.title}</td><td>{new Date().toLocaleDateString('ar-IQ')}</td><td><span className="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded">غير محدد</span></td></tr>)}
                                        {offersHistory.length === 0 && <tr><td colSpan="3" className="text-center py-8 text-gray-500 font-bold text-lg">لا توجد بيانات حالياً</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* Print Preview Modal */}
                    <Modal title="معاينة التقرير الشامل للعميل" isOpen={showPrintModal} onClose={() => setShowPrintModal(false)} size="max-w-4xl" customHeader={<div className="p-4 border-b flex justify-between items-center bg-gray-50 print-hide"><h3 className="font-bold text-lg text-gray-800">معاينة للطباعة - تقرير العميل</h3><button onClick={()=>setShowPrintModal(false)} className="text-gray-400 hover:text-red-500"><Icons.X/></button></div>}>
                        <div id="printable-area" className="bg-white text-gray-900 text-sm">
                            <div className="text-center border-b-4 border-gray-800 pb-4 mb-6">
                                <h1 className="text-3xl font-black tracking-wider text-gray-900">هندسة السيارات</h1>
                                <p className="text-lg font-bold text-gray-600 mt-1">التقرير الشامل لملف العميل</p>
                            </div>
                            
                            <div className="border-2 border-gray-300 p-4 rounded-lg mb-6 bg-gray-50">
                                <h3 className="font-black text-lg border-b border-gray-300 pb-2 mb-3">1. معلومات العميل والمركبة</h3>
                                <div className="grid grid-cols-3 gap-4">
                                    <div><p className="text-gray-500 text-xs">اسم العميل:</p><p className="font-bold text-base">{customer.name}</p></div>
                                    <div><p className="text-gray-500 text-xs">رقم الهاتف:</p><p className="font-bold text-base" dir="ltr">{customer.phone}</p></div>
                                    <div><p className="text-gray-500 text-xs">التصنيف:</p><p className="font-bold text-base">{customer.segment}</p></div>
                                    <div><p className="text-gray-500 text-xs">المركبة:</p><p className="font-bold text-base">{customer.vehicleType} {customer.vehicleModel}</p></div>
                                    <div><p className="text-gray-500 text-xs">رقم اللوحة:</p><p className="font-bold text-base">{customer.plateNumber || '-'}</p></div>
                                    <div><p className="text-gray-500 text-xs">إجمالي الصرف:</p><p className="font-bold text-base text-green-600">{formatMoney(customer.totalSpent)}</p></div>
                                </div>
                            </div>

                            <div className="mb-6 print-break-inside-avoid">
                                <h3 className="font-black text-lg border-b-2 border-gray-800 pb-1 mb-3">2. ملخص الزيارات وفواتير الصيانة</h3>
                                <table className="w-full text-right border-collapse border-2 border-gray-300">
                                    <thead className="bg-gray-100"><tr><th className="p-2 border border-gray-300">رقم الطلب</th><th className="p-2 border border-gray-300">التاريخ</th><th className="p-2 border border-gray-300">الخدمات</th><th className="p-2 border border-gray-300">المبلغ</th></tr></thead>
                                    <tbody>
                                        {custOrders.map(wo => <tr key={wo.id}><td className="p-2 border border-gray-300 font-bold">{wo.id}</td><td className="p-2 border border-gray-300">{wo.date}</td><td className="p-2 border border-gray-300">{wo.services.join('، ')}</td><td className="p-2 border border-gray-300 font-bold">{formatMoney(wo.total)}</td></tr>)}
                                        {custOrders.length === 0 && <tr><td colSpan="4" className="p-4 text-center font-bold text-gray-500">لا توجد بيانات حالياً</td></tr>}
                                    </tbody>
                                </table>
                            </div>

                            <div className="mb-6 print-break-inside-avoid">
                                <h3 className="font-black text-lg border-b-2 border-gray-800 pb-1 mb-3">3. التفاصيل الدقيقة للقطع والخدمات المستهلكة</h3>
                                <table className="w-full text-right border-collapse border-2 border-gray-300">
                                    <thead className="bg-gray-100"><tr><th className="p-2 border border-gray-300">تاريخ الطلب</th><th className="p-2 border border-gray-300">الخدمة / القطعة</th><th className="p-2 border border-gray-300">الكمية</th><th className="p-2 border border-gray-300">الإجمالي</th></tr></thead>
                                    <tbody>
                                        {detailedServicesList.map((s,i) => <tr key={i}><td className="p-2 border border-gray-300">{s.date}</td><td className="p-2 border border-gray-300 font-bold">{s.name} <span className="font-normal text-gray-500">({Object.values(s.details||{}).join(' ')})</span></td><td className="p-2 border border-gray-300 text-center">{s.qty||1}</td><td className="p-2 border border-gray-300 font-bold">{formatMoney((parseFloat(s.price)||0)*(parseFloat(s.qty)||1))}</td></tr>)}
                                        {detailedServicesList.length === 0 && <tr><td colSpan="4" className="p-4 text-center font-bold text-gray-500">لا توجد بيانات حالياً</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div className="flex justify-end gap-3 mt-6 pt-4 border-t print-hide">
                            <button onClick={()=>setShowPrintModal(false)} className="px-6 py-2 bg-gray-200 text-gray-700 rounded font-bold hover:bg-gray-300">إغلاق</button>
                            <button onClick={()=>{ window.print(); addToast("جاري التوجيه للطباعة", "success"); }} className="px-8 py-2 bg-brand text-white rounded font-bold shadow-md hover:bg-blue-700 flex items-center gap-2"><Icons.FileText /> طباعة التقرير</button>
                        </div>
                    </Modal>
                </div>
            );
        }

        // 3. Work Order Form
        const WorkOrder = ({ db, updateDb, addToast }) => {
            const serviceDefs = [
                { id: 1, name: 'زيت المحرك', fields: [{key: 'oilType', label: 'نوع الزيت'}, {key: 'viscosity', label: 'اللزوجة'}, {key: 'liters', label: 'الكمية/لتر', type: 'number'}] },
                { id: 2, name: 'فلتر زيت المحرك', fields: [{key: 'filterType', label: 'نوع الفلتر'}, {key: 'filterNum', label: 'رقم الفلتر'}] },
                { id: 3, name: 'فلتر الهواء', fields: [{key: 'filterType', label: 'نوع الفلتر'}, {key: 'filterNum', label: 'رقم الفلتر'}] },
                { id: 4, name: 'فلتر التبريد', fields: [{key: 'filterType', label: 'نوع الفلتر'}, {key: 'filterNum', label: 'رقم الفلتر'}] },
                { id: 5, name: 'زيت ناقل الحركة (القير)', fields: [{key: 'oilType', label: 'نوع الزيت'}] },
                { id: 6, name: 'نظام التبريد', fields: [{key: 'waterType', label: 'نوع الماء'}, {key: 'qty', label: 'العدد', type: 'number'}] },
                { id: 7, name: 'البطارية', fields: [{key: 'batteryType', label: 'نوع البطارية'}] },
                { id: 8, name: 'فلتر البنزين', fields: [{key: 'filterType', label: 'نوع الفلتر'}, {key: 'filterNum', label: 'رقم الفلتر'}] },
                { id: 9, name: 'السفايف (البريكات)', fields: [{key: 'padsType', label: 'نوع السفايف'}] },
                { id: 10, name: 'شمعات الاحتراق', fields: [{key: 'plugsType', label: 'نوع الشمعات'}] },
                { id: 11, name: 'سائل الفرامل', fields: [] },
                { id: 12, name: 'المساحات', fields: [] },
            ];

            const initialServices = () => serviceDefs.map(def => ({
                id: def.id, name: def.name, status: '', price: '', notes: '', details: def.fields.reduce((acc, f) => ({...acc, [f.key]: ''}), {})
            }));

            const [services, setServices] = useState(initialServices());
            const [custData, setCustData] = useState({ name: '', phone: '', vehicle: '', plate: '', km: '' });
            const [discount, setDiscount] = useState('');
            const [paid, setPaid] = useState('');
            const [finalNotes, setFinalNotes] = useState('');
            const [isGeneratingNotes, setIsGeneratingNotes] = useState(false);
            const [showPrintModal, setShowPrintModal] = useState(false);
            const [orderNumber, setOrderNumber] = useState(`WO-${Math.floor(10000 + Math.random() * 90000)}`);
            const today = new Date().toISOString().split('T')[0];

            // Calculations based on quantity/liters
            const calculateRowTotal = (srv) => {
                const price = parseFloat(srv.price) || 0;
                let multiplier = 1;
                if (srv.details.liters) multiplier = parseFloat(srv.details.liters) || 1;
                else if (srv.details.qty) multiplier = parseFloat(srv.details.qty) || 1;
                return price * multiplier;
            };

            const subTotal = useMemo(() => services.reduce((acc, s) => acc + calculateRowTotal(s), 0), [services]);
            const finalTotal = useMemo(() => Math.max(0, subTotal - (parseFloat(discount) || 0)), [subTotal, discount]);
            const remaining = useMemo(() => Math.max(0, finalTotal - (parseFloat(paid) || 0)), [finalTotal, paid]);

            const handleServiceChange = (index, field, value) => {
                const newServices = [...services];
                newServices[index][field] = value;
                setServices(newServices);
            };

            const handleDetailChange = (index, key, value) => {
                const newServices = [...services];
                newServices[index].details[key] = value;
                setServices(newServices);
            };

            const handleGenerateNotes = async () => {
                setIsGeneratingNotes(true);
                const badServices = services.filter(s => s.status === 'يحتاج تبديل').map(s => s.name);
                const goodServices = services.filter(s => s.status === 'جيد').map(s => s.name);
                let prompt = `أنت مهندس سيارات. اكتب فقرة "توصيات فنية" للعميل بناءً على الفحص. السيارة: ${custData.vehicle || 'غير محدد'}. `;
                if (badServices.length > 0) prompt += `أجزاء تحتاج تبديل ضروري: ${badServices.join('، ')}. حذره بلباقة.\n`;
                if (goodServices.length > 0) prompt += `أجزاء سليمة: ${goodServices.join('، ')}.\n`;
                prompt += `اكتب التوصيات بلغة عربية احترافية ومختصرة جداً (لا تتجاوز 3 أسطر) للفاتورة. لا تستخدم مقدمات.`;
                const text = await generateWithGemini(prompt);
                setFinalNotes(text.trim());
                setIsGeneratingNotes(false);
            };

            const handleSaveAndClose = () => {
                if(!custData.name || !custData.phone) return addToast("الرجاء إدخال اسم العميل ورقم الهاتف", "error");
                
                const existingCustIndex = db.customers.findIndex(c => c.phone === custData.phone);
                let newCustomers = [...db.customers];
                
                if(existingCustIndex === -1) {
                    newCustomers.push({ id: `C-${Date.now()}`, name: custData.name, phone: custData.phone, vehicleType: custData.vehicle, segment: 'عميل جديد', totalSpent: finalTotal, visitsCount: 1, status: 'نشط', lastVisit: today });
                } else {
                    newCustomers[existingCustIndex].totalSpent += finalTotal;
                    newCustomers[existingCustIndex].visitsCount += 1;
                    newCustomers[existingCustIndex].lastVisit = today;
                }
                updateDb('customers', newCustomers);

                const validServices = services.filter(s => parseFloat(s.price) > 0 || s.status);
                const executedServicesNames = validServices.map(s => s.name);
                const detailedServices = validServices.map(s => ({
                    name: s.name, status: s.status, price: s.price, qty: (s.details.liters||s.details.qty||1), details: s.details
                }));

                const newOrder = { id: orderNumber, date: today, customerName: custData.name, vehicle: custData.vehicle, services: executedServicesNames, detailedServices, technician: 'فريق الورشة', total: finalTotal, status: 'مكتمل', feedback: false, notes: finalNotes };
                updateDb('workOrders', [newOrder, ...db.workOrders]);

                const newQueueItems = [];
                newQueueItems.push({ id: Date.now()+1, customerName: custData.name, phone: custData.phone, vehicle: custData.vehicle, lastVisit: today, reason: 'متابعة رضا العميل بعد الخدمة', type: 'رضا العميل', priority: 'عالية', status: 'قيد الانتظار' });
                if(executedServicesNames.some(s => s.includes('زيت'))) {
                    newQueueItems.push({ id: Date.now()+2, customerName: custData.name, phone: custData.phone, vehicle: custData.vehicle, lastVisit: today, reason: 'تذكير تغيير زيت بعد 30 يوم', type: 'تذكير تغيير زيت', priority: 'عادية', status: 'قيد الانتظار' });
                }
                if(newQueueItems.length > 0) updateDb('communicationQueue', [...db.communicationQueue, ...newQueueItems]);

                addToast("تم حفظ ورقة العمل وأتمتة المهام بنجاح", "success");
                setCustData({ name: '', phone: '', vehicle: '', plate: '', km: '' });
                setServices(initialServices());
                setDiscount(''); setPaid(''); setFinalNotes('');
                setOrderNumber(`WO-${Math.floor(10000 + Math.random() * 90000)}`);
            };

            const handleCancel = () => {
                if(window.confirm("هل أنت متأكد من إلغاء ورقة العمل؟ سيتم مسح كافة البيانات المدخلة.")) {
                    setCustData({ name: '', phone: '', vehicle: '', plate: '', km: '' });
                    setServices(initialServices());
                    setDiscount(''); setPaid(''); setFinalNotes('');
                    addToast("تم الإلغاء وتفريغ الحقول", "success");
                }
            };

            return (
                <div className="space-y-6 max-w-6xl mx-auto pb-20">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end border-b-2 border-gray-800 pb-4 gap-4">
                        <div><h2 className="text-3xl font-black text-gray-900 tracking-tight">هندسة السيارات</h2><p className="text-gray-500 font-bold mt-1">ورقة عمل وصيانة المركبات</p></div>
                        <div className="text-left bg-gray-100 p-3 rounded-lg border border-gray-300 w-full md:w-auto">
                            <div className="text-sm text-gray-600">رقم الطلب: <span className="font-bold text-lg text-red-600 ml-2">{orderNumber}</span></div>
                            <div className="text-sm text-gray-600">التاريخ: <span className="font-bold">{new Date().toLocaleDateString('ar-IQ')}</span></div>
                        </div>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm space-y-4">
                        <h3 className="font-bold text-brand border-b pb-2 mb-3">بيانات العميل والسيارة</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                            <div><label className="block text-xs text-gray-500 mb-1">اسم العميل *</label><input type="text" className="w-full border p-2 rounded bg-gray-50" value={custData.name} onChange={e=>setCustData({...custData, name:e.target.value})} /></div>
                            <div><label className="block text-xs text-gray-500 mb-1">رقم الهاتف *</label><input type="text" className="w-full border p-2 rounded bg-gray-50" value={custData.phone} onChange={e=>setCustData({...custData, phone:e.target.value})} dir="ltr" /></div>
                            <div><label className="block text-xs text-gray-500 mb-1">نوع السيارة والموديل</label><input type="text" className="w-full border p-2 rounded bg-gray-50" value={custData.vehicle} onChange={e=>setCustData({...custData, vehicle:e.target.value})} /></div>
                            <div><label className="block text-xs text-gray-500 mb-1">رقم اللوحة</label><input type="text" className="w-full border p-2 rounded bg-gray-50" value={custData.plate} onChange={e=>setCustData({...custData, plate:e.target.value})} /></div>
                            <div><label className="block text-xs text-gray-500 mb-1">عداد الكيلومتر</label><input type="number" className="w-full border p-2 rounded bg-gray-50" value={custData.km} onChange={e=>setCustData({...custData, km:e.target.value})} /></div>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                        <div className="bg-gray-800 text-white p-4"><h3 className="font-bold text-lg">قائمة فحص وتنفيذ الخدمات</h3></div>
                        <div className="p-0 overflow-x-auto">
                            <table className="w-full text-sm text-right min-w-[800px]">
                                <thead className="bg-gray-100 border-b-2 border-gray-300">
                                    <tr><th className="p-3 w-10">ت</th><th className="p-3 w-40">الخدمة</th><th className="p-3 w-32">الحالة</th><th className="p-3">التفاصيل (الكمية والأنواع)</th><th className="p-3 w-32">سعر الوحدة</th><th className="p-3 w-40">ملاحظات</th></tr>
                                </thead>
                                <tbody>
                                    {services.map((srv, index) => (
                                        <tr key={srv.id} className="border-b border-gray-200 hover:bg-gray-50">
                                            <td className="p-3 text-center font-bold text-gray-500">{index + 1}</td>
                                            <td className="p-3 font-bold text-gray-800">{srv.name}</td>
                                            <td className="p-3">
                                                <select className="border p-1 text-xs w-full rounded" value={srv.status} onChange={e => handleServiceChange(index, 'status', e.target.value)}>
                                                    <option value="">- الحالة -</option><option value="جيد">جيد</option><option value="يحتاج تبديل">يحتاج تبديل</option>
                                                </select>
                                            </td>
                                            <td className="p-3">
                                                <div className="flex flex-wrap gap-2 items-end">
                                                    {serviceDefs[index].fields.map((f, i) => (
                                                        <div key={i} className="flex flex-col">
                                                            <span className="text-[10px] text-gray-500">{f.label}</span>
                                                            <input type={f.type||"text"} className="border rounded px-2 py-1 text-xs w-20 bg-white" value={srv.details[f.key]} onChange={e => handleDetailChange(index, f.key, e.target.value)} />
                                                        </div>
                                                    ))}
                                                </div>
                                            </td>
                                            <td className="p-3"><input type="number" className="w-full border rounded p-2 text-sm" placeholder="0" value={srv.price} onChange={e => handleServiceChange(index, 'price', e.target.value)} /></td>
                                            <td className="p-3"><input type="text" className="w-full border rounded p-2 text-xs" placeholder="ملاحظة..." value={srv.notes} onChange={e => handleServiceChange(index, 'notes', e.target.value)} /></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col">
                            <div className="flex justify-between items-center border-b pb-2 mb-3">
                                <h3 className="font-bold text-brand">ملاحظات الفني والتوصيات</h3>
                                <button onClick={handleGenerateNotes} disabled={isGeneratingNotes} className="text-xs bg-yellow-100 text-yellow-700 px-3 py-1 rounded font-bold hover:bg-yellow-200 transition-colors flex items-center gap-1 disabled:opacity-50 shadow-sm">
                                    {isGeneratingNotes ? 'جاري التحليل...' : '✨ تحليل الفحص ذكياً'}
                                </button>
                            </div>
                            <textarea className="flex-1 w-full border rounded-lg p-3 bg-gray-50 min-h-[120px] focus:border-brand" placeholder="اكتب النتيجة النهائية والتوصيات هنا..." value={finalNotes} onChange={e=>setFinalNotes(e.target.value)}></textarea>
                        </div>

                        <div className="bg-gray-800 text-white p-6 rounded-xl shadow-lg border border-gray-900 flex flex-col justify-between">
                            <h3 className="font-bold text-lg border-b border-gray-700 pb-2 mb-4">ملخص الحسابات</h3>
                            <div className="space-y-3 text-sm">
                                <div className="flex justify-between"><span className="text-gray-300">إجمالي الخدمات:</span><span className="font-bold">{formatMoney(subTotal)}</span></div>
                                <div className="flex justify-between items-center"><span className="text-gray-300">الخصم (د.ع):</span><input type="number" className="w-24 px-2 py-1 text-gray-900 rounded text-left font-bold" placeholder="0" value={discount} onChange={e=>setDiscount(e.target.value)} /></div>
                                <div className="flex justify-between items-center"><span className="text-gray-300">المبلغ المدفوع (د.ع):</span><input type="number" className="w-24 px-2 py-1 text-gray-900 rounded text-left font-bold text-green-700" placeholder="0" value={paid} onChange={e=>setPaid(e.target.value)} /></div>
                                <div className="flex justify-between pt-3 border-t border-gray-700"><span className="text-gray-300">المبلغ المتبقي:</span><span className="font-bold text-red-400">{formatMoney(remaining)}</span></div>
                            </div>
                            <div className="pt-4 mt-4 border-t border-gray-700 flex justify-between items-center text-2xl font-black text-green-400">
                                <span>المجموع النهائي:</span><span>{formatMoney(finalTotal)}</span>
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-col sm:flex-row justify-end gap-3 mt-6">
                        <button onClick={handleCancel} className="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-bold hover:bg-gray-300 w-full sm:w-auto">إلغاء وتفريغ</button>
                        <button onClick={()=>setShowPrintModal(true)} className="px-6 py-3 bg-blue-100 text-brand rounded-lg font-bold border border-blue-200 hover:bg-blue-200 w-full sm:w-auto flex justify-center items-center gap-2 shadow-sm"><Icons.FileText/> طباعة الفاتورة</button>
                        <button onClick={handleSaveAndClose} className="px-6 py-3 bg-brand text-white rounded-lg font-bold shadow-lg hover:bg-blue-700 w-full sm:w-auto flex justify-center items-center gap-2"><Icons.Check/> حفظ وإغلاق الطلب</button>
                    </div>

                    <Modal title="معاينة الفاتورة للطباعة" isOpen={showPrintModal} onClose={() => setShowPrintModal(false)} size="max-w-4xl" customHeader={<div className="p-4 border-b flex justify-between items-center bg-gray-50 print-hide"><h3 className="font-bold text-lg text-gray-800">معاينة للطباعة - الفاتورة</h3><button onClick={()=>setShowPrintModal(false)} className="text-gray-400 hover:text-red-500"><Icons.X/></button></div>}>
                        <div id="printable-area" className="bg-white text-gray-900">
                            <div className="flex justify-between border-b-4 border-gray-800 pb-6 mb-6">
                                <div className="w-1/2">
                                    <h1 className="text-4xl font-black tracking-wider text-gray-900">هندسة السيارات</h1>
                                    <p className="text-lg font-bold text-gray-600 mt-2">لصيانة المركبات وبرمجتها</p>
                                    <p className="text-sm mt-1">العراق - هاتف: 07900000000</p>
                                </div>
                                <div className="text-right w-1/3">
                                    <div className="border-2 border-gray-300 p-4 rounded-lg bg-gray-50">
                                        <p className="text-lg font-black text-brand mb-2 border-b border-gray-300 pb-2">فاتورة ضريبية / ورقة عمل</p>
                                        <p className="text-sm mb-1">رقم الفاتورة: <strong className="text-red-600 text-lg">{orderNumber}</strong></p>
                                        <p className="text-sm">تاريخ الفاتورة: <strong>{today}</strong></p>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="grid grid-cols-2 gap-4 mb-8 border-2 border-gray-200 p-5 rounded-lg bg-gray-50">
                                <div><span className="text-sm text-gray-500 block mb-1">معلومات العميل</span><p className="font-bold text-xl">{custData.name || '---'}</p><p className="font-medium mt-1" dir="ltr">{custData.phone || '---'}</p></div>
                                <div><span className="text-sm text-gray-500 block mb-1">معلومات المركبة</span><p className="font-bold text-lg">{custData.vehicle || '---'}</p><p className="text-sm mt-1">اللوحة: {custData.plate || '---'} | العداد: {custData.km || '---'} كم</p></div>
                            </div>

                            <table className="w-full text-right mb-8 border-collapse border-2 border-gray-300">
                                <thead>
                                    <tr className="bg-gray-100 border-b-2 border-gray-300 text-gray-800">
                                        <th className="p-3 border border-gray-300 w-10 text-center">ت</th>
                                        <th className="p-3 border border-gray-300">الخدمة / البيان</th>
                                        <th className="p-3 border border-gray-300 w-24 text-center">الكمية</th>
                                        <th className="p-3 border border-gray-300 w-32 text-center">سعر الوحدة</th>
                                        <th className="p-3 border border-gray-300 w-32 text-center">الإجمالي</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {services.filter(s => parseFloat(s.price) > 0 || s.status).map((s, i) => {
                                        let qty = 1; let qtyLabel = '-';
                                        if (s.details.liters) { qty = parseFloat(s.details.liters)||1; qtyLabel = `${qty} لتر`; }
                                        else if (s.details.qty) { qty = parseFloat(s.details.qty)||1; qtyLabel = `${qty}`; }
                                        const rowTotal = (parseFloat(s.price)||0) * qty;
                                        return (
                                            <tr key={s.id} className="border-b border-gray-200">
                                                <td className="p-3 border border-gray-300 text-center font-bold">{i+1}</td>
                                                <td className="p-3 border border-gray-300">
                                                    <p className="font-bold text-lg">{s.name}</p>
                                                    <p className="text-sm text-gray-600">{Object.values(s.details).filter(v=>v).join(' - ')} {s.notes ? `| ${s.notes}`:''}</p>
                                                </td>
                                                <td className="p-3 border border-gray-300 text-center font-medium">{qtyLabel}</td>
                                                <td className="p-3 border border-gray-300 text-center">{formatMoney(s.price)}</td>
                                                <td className="p-3 border border-gray-300 text-center font-bold">{formatMoney(rowTotal)}</td>
                                            </tr>
                                        )
                                    })}
                                    {services.filter(s => parseFloat(s.price) > 0 || s.status).length === 0 && <tr><td colSpan="5" className="p-8 text-center text-gray-500 font-bold text-lg">لم يتم إدخال أي خدمات مسعرة في هذه الفاتورة</td></tr>}
                                </tbody>
                            </table>

                            <div className="flex justify-between items-start print-break-inside-avoid">
                                <div className="w-1/2 pr-4">
                                    {finalNotes && (
                                        <div className="bg-gray-50 p-4 border-2 border-gray-200 rounded-lg">
                                            <h4 className="font-bold text-gray-800 mb-2 border-b pb-2">توصيات وملاحظات الفحص:</h4>
                                            <p className="text-sm text-gray-800 whitespace-pre-wrap leading-relaxed">{finalNotes}</p>
                                        </div>
                                    )}
                                </div>
                                <div className="w-2/5">
                                    <table className="w-full border-collapse border-2 border-gray-300 text-sm">
                                        <tbody>
                                            <tr><th className="p-2 border border-gray-300 bg-gray-50 text-right">الإجمالي الفرعي:</th><td className="p-2 border border-gray-300 text-left font-bold">{formatMoney(subTotal)}</td></tr>
                                            <tr><th className="p-2 border border-gray-300 bg-gray-50 text-right">الخصم:</th><td className="p-2 border border-gray-300 text-left text-red-600">{formatMoney(discount)}</td></tr>
                                            <tr><th className="p-3 border border-gray-800 bg-gray-800 text-white text-right text-lg">المبلغ النهائي:</th><td className="p-3 border border-gray-800 text-left text-xl font-black bg-gray-100">{formatMoney(finalTotal)}</td></tr>
                                            <tr><th className="p-2 border border-gray-300 bg-gray-50 text-right">المبلغ المدفوع:</th><td className="p-2 border border-gray-300 text-left text-green-600 font-bold">{formatMoney(paid)}</td></tr>
                                            <tr><th className="p-2 border border-gray-300 bg-gray-50 text-right">المتبقي بذمة العميل:</th><td className="p-2 border border-gray-300 text-left font-bold">{formatMoney(remaining)}</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div className="flex justify-between mt-20 pt-8 border-t-2 border-gray-800 print-break-inside-avoid">
                                <div className="text-center w-1/3"><p className="font-bold text-lg mb-12">توقيع العميل</p><p className="text-gray-400">..............................</p></div>
                                <div className="text-center w-1/3"><p className="font-bold text-lg mb-12">ختم وتوقيع الورشة</p><p className="text-gray-400">..............................</p></div>
                            </div>
                        </div>

                        <div className="flex justify-end gap-3 mt-6 pt-4 border-t print-hide">
                            <button onClick={()=>setShowPrintModal(false)} className="px-6 py-2 bg-gray-200 text-gray-700 rounded font-bold hover:bg-gray-300">إغلاق المعاينة</button>
                            <button onClick={()=>{ window.print(); }} className="px-8 py-2 bg-brand text-white rounded font-bold shadow-md hover:bg-blue-700 flex items-center gap-2"><Icons.FileText /> تأكيد وطباعة الفاتورة</button>
                        </div>
                    </Modal>
                </div>
            );
        };

        // 4. Visits and History
        const History = ({ db, updateDb, onViewProfile, addToast }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [dateFilter, setDateFilter] = useState('');
            const [serviceFilter, setServiceFilter] = useState('كل الخدمات');
            const [statusFilter, setStatusFilter] = useState('الكل');

            const [selectedOrder, setSelectedOrder] = useState(null);
